<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GTA FULL PC + MOBILE GAME</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
body{margin:0;overflow:hidden;font-family:Arial;touch-action:none;}

/* UI */
#ui{
position:absolute;top:10px;left:10px;
background:rgba(0,0,0,0.6);
color:white;padding:10px;border-radius:10px;
}

/* BATTLE */
#battleBox{
position:absolute;bottom:10px;left:50%;
transform:translateX(-50%) scale(0);
background:rgba(0,0,0,0.9);
color:white;
padding:10px;
width:300px;
transition:0.3s;
border-radius:10px;
}
#battleBox.active{
transform:translateX(-50%) scale(1);
}
button{width:100%;margin:5px 0;padding:8px;}

/* JOYSTICK */
#joystickBase{
position:absolute;
bottom:40px;
left:40px;
width:120px;
height:120px;
background:rgba(255,255,255,0.2);
border-radius:50%;
}

#joystickStick{
position:absolute;
top:50%;
left:50%;
width:40px;
height:40px;
background:white;
border-radius:50%;
transform:translate(-50%,-50%);
}
</style>
</head>

<body>

<div id="ui">
Coins: <span id="coins">0</span> |
Health: <span id="health">100</span>
</div>

<div id="battleBox">
<h3>⚔ Battle</h3>
<p id="qText"></p>
<div id="opts"></div>
</div>

<div id="joystickBase">
<div id="joystickStick"></div>
</div>

<script>

/* SCENE */
let scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);

/* CAMERA */
let camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,5,10);

/* RENDER */
let renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */
scene.add(new THREE.AmbientLight(0xffffff,1));

/* GROUND */
let ground=new THREE.Mesh(
new THREE.PlaneGeometry(200,200),
new THREE.MeshStandardMaterial({color:0x2d6a4f})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

/* CITY */
for(let i=0;i<25;i++){
let b=new THREE.Mesh(
new THREE.BoxGeometry(2+Math.random()*4,2+Math.random()*10,2+Math.random()*4),
new THREE.MeshStandardMaterial({color:0x555555})
);
b.position.set((Math.random()-0.5)*100,1,(Math.random()-0.5)*100);
scene.add(b);
}

/* PLAYER */
let player=new THREE.Group();
scene.add(player);

let body=new THREE.Mesh(
new THREE.CapsuleGeometry(0.5,1,4,8),
new THREE.MeshStandardMaterial({color:0x0077ff})
);

let head=new THREE.Mesh(
new THREE.SphereGeometry(0.5),
new THREE.MeshStandardMaterial({color:0xffcc99})
);

head.position.y=1.5;
player.add(body);
player.add(head);

/* DATA */
let coins=0;
let health=100;

/* ENEMIES */
let enemies=[];

function spawnEnemy(){
let e=new THREE.Group();

let b=new THREE.Mesh(
new THREE.CapsuleGeometry(0.5,1,4,8),
new THREE.MeshStandardMaterial({color:0xff3333})
);

let h=new THREE.Mesh(
new THREE.SphereGeometry(0.5),
new THREE.MeshStandardMaterial({color:0xffcc99})
);

h.position.y=1.5;
e.add(b); e.add(h);

e.position.set((Math.random()-0.5)*100,0,(Math.random()-0.5)*100);

e.userData={
speed:0.02+Math.random()*0.03,
dir:Math.random()*Math.PI*2
};

scene.add(e);
enemies.push(e);
}

for(let i=0;i<30;i++) spawnEnemy();

/* ⭐ FIXED QLIST (NOW QUESTIONS WILL SHOW) */
let qList=[
{q:"How are you?",o:["I am fine","I am 20","I am Delhi"],a:0},
{q:"What is your name?",o:["My name is...","I am fine","Good morning"],a:0},
{q:"Capital of India?",o:["Delhi","Mumbai","Goa"],a:0},
{q:"Where do you live?",o:["I live in India","I am fine","Thank you"],a:0},
{q:"Good morning means?",o:["Morning greeting","Night","Food"],a:0},
{q:"Apple is a?",o:["Fruit","Animal","Car"],a:0},
{q:"What is this?",o:["Question","Answer","Book"],a:0},
{q:"He ___ playing",o:["is","are","am"],a:0},
{q:"She ___ reading",o:["is","are","am"],a:0},
{q:"2+2?",o:["3","4","5"],a:1},
{q:"Thank you reply?",o:["Welcome","Sorry","Bye"],a:0},
{q:"What is your age?",o:["I am 20","I am fine","Delhi"],a:0},
{q:"Water formula?",o:["H2O","CO2","O2"],a:0},
{q:"Where is Taj Mahal?",o:["Agra","Delhi","Mumbai"],a:0},
{q:"Good night means?",o:["Sleep time","Morning","Food"],a:0},
{q:"I am hungry means?",o:["Bhukh lagi","Sleep","Happy"],a:0},
{q:"What is your hobby?",o:["Reading","Car","Apple"],a:0},
{q:"How old are you?",o:["I am 15","I am Delhi","I am fine"],a:0},
{q:"What is your favourite color?",o:["Blue","Dog","Run"],a:0},
{q:"Where are you from?",o:["India","Apple","Car"],a:0},
{q:"What is 5+5?",o:["10","9","11"],a:0},
{q:"What is your school name?",o:["ABC School","Good morning","Fruit"],a:0},
{q:"Do you like English?",o:["Yes","No answer","Car"],a:0},
{q:"What is 10-2?",o:["8","9","7"],a:0},
{q:"What is sun color?",o:["Yellow","Green","Blue"],a:0},
{q:"What is water?",o:["Liquid","Animal","Car"],a:0},
{q:"Where do birds live?",o:["Sky","Water","Road"],a:0},
{q:"What is 3+4?",o:["7","6","8"],a:0},
{q:"What is your father name?",o:["John","Apple","Car"],a:0},
{q:"What is moon?",o:["Satellite","Star","Sun"],a:0},
{q:"What is 6+2?",o:["8","7","9"],a:0},
{q:"5+3?",o:["7","8","9"],a:1},
{q:"Sun is a?",o:["Star","Planet","Moon"],a:0},
{q:"Dog says?",o:["Bark","Meow","Crow"],a:0},
{q:"How to greet?",o:["Hello","Bye","Food"],a:0},
{q:"What do you eat?",o:["Food","Car","Stone"],a:0},
{q:"Where is India?",o:["Asia","Europe","Africa"],a:0},
{q:"What is 9-3?",o:["6","5","7"],a:0},
{q:"What is dog sound?",o:["Bark","Meow","Chirp"],a:0},
{q:"What is 2*2?",o:["4","3","5"],a:0},
{q:"What is your favourite food?",o:["Pizza","Car","Book"],a:0},
{q:"What is 7+3?",o:["10","11","9"],a:0},
{q:"Do you like school?",o:["Yes","No answer","Apple"],a:0},
{q:"What is 12-4?",o:["8","7","9"],a:0},
{q:"What is your country?",o:["India","USA","Goa"],a:0},
{q:"Where is water found?",o:["River","Sky","Fire"],a:0},
{q:"What is 4+6?",o:["10","9","11"],a:0},
{q:"What is cow gives?",o:["Milk","Oil","Water"],a:0},
{q:"What is 8-3?",o:["5","6","4"],a:0},
{q:"What is your age?",o:["I am 10","I am fine","Delhi"],a:0},
{q:"What is sun gives?",o:["Light","Water","Food"],a:0},
{q:"What is 6+6?",o:["12","11","13"],a:0},
{q:"What is bird can do?",o:["Fly","Swim","Run only"],a:0},
{q:"What is 10/2?",o:["5","4","6"],a:0},
{q:"Where do fish live?",o:["Water","Air","Land"],a:0},
{q:"What is 3+5?",o:["8","7","9"],a:0},
{q:"What is your name?",o:["My name is...","I am fine","Good"],a:0},
{q:"What is 9+1?",o:["10","11","9"],a:0},
{q:"What is moon light?",o:["Reflection","Fire","Water"],a:0},
{q:"What is 5*2?",o:["10","9","11"],a:0},
];

let battle=false;

/* EXPLOSION */
function boom(x,y,z){
for(let i=0;i<15;i++){
let p=new THREE.Mesh(
new THREE.SphereGeometry(0.1),
new THREE.MeshStandardMaterial({color:0xffaa00})
);
p.position.set(x,y,z);
scene.add(p);

let vx=(Math.random()-0.5)*0.4;
let vy=Math.random()*0.3;
let vz=(Math.random()-0.5)*0.4;

let t=0;
let id=setInterval(()=>{
p.position.x+=vx;
p.position.y+=vy;
p.position.z+=vz;
t++;
if(t>20){
clearInterval(id);
scene.remove(p);
}
},20);
}
}

/* BATTLE (SAFE FIX) */
function startBattle(enemy){
if(battle || !enemy) return;

battle=true;

let q=qList[Math.floor(Math.random()*qList.length)];

document.getElementById("battleBox").classList.add("active");
document.getElementById("qText").innerText=q.q;

let div=document.getElementById("opts");
div.innerHTML="";

q.o.forEach((op,i)=>{
let b=document.createElement("button");
b.innerText=op;

b.onclick=()=>{

if(i===q.a){
boom(enemy.position.x,enemy.position.y,enemy.position.z);
scene.remove(enemy);
enemies=enemies.filter(e=>e!==enemy);
coins+=10;
}
else{
health-=10;
}

setTimeout(()=>{
document.getElementById("battleBox").classList.remove("active");
battle=false;
},500);

updateUI();
};

div.appendChild(b);
});
}

/* UI */
function updateUI(){
document.getElementById("coins").innerText=coins;
document.getElementById("health").innerText=health;
}

/* KEYBOARD */
let keys={};
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

/* JOYSTICK */
let joyBase=document.getElementById("joystickBase");
let joyStick=document.getElementById("joystickStick");

let joyX=0, joyY=0;
let active=false;

joyBase.addEventListener("touchstart",()=>active=true);

joyBase.addEventListener("touchend",()=>{
active=false;
joyX=0; joyY=0;
joyStick.style.transform="translate(-50%,-50%)";
});

joyBase.addEventListener("touchmove",(e)=>{
if(!active) return;

let rect=joyBase.getBoundingClientRect();
let x=e.touches[0].clientX-rect.left-rect.width/2;
let y=e.touches[0].clientY-rect.top-rect.height/2;

joyX=Math.max(-1,Math.min(1,x/50));
joyY=Math.max(-1,Math.min(1,y/50));

joyStick.style.transform=
`translate(calc(-50% + ${joyX*40}px),calc(-50% + ${joyY*40}px))`;
});

/* LOOP */
function animate(){
requestAnimationFrame(animate);

/* PLAYER MOVE */
let speed=0.25;

let moveX=0;
let moveZ=0;

if(keys["ArrowUp"]) moveZ-=speed;
if(keys["ArrowDown"]) moveZ+=speed;
if(keys["ArrowLeft"]) moveX-=speed;
if(keys["ArrowRight"]) moveX+=speed;

moveX+=joyX*0.3;
moveZ+=joyY*0.3;

player.position.x+=moveX;
player.position.z+=moveZ;

/* ENEMY AI */
enemies.forEach(e=>{

let dx=player.position.x-e.position.x;
let dz=player.position.z-e.position.z;
let dist=Math.sqrt(dx*dx+dz*dz);

let nx=dx/(dist+0.001);
let nz=dz/(dist+0.001);

if(dist<20){
e.position.x-=nx*0.06;
e.position.z-=nz*0.06;
}
else{
e.position.x+=Math.cos(e.userData.dir)*e.userData.speed;
e.position.z+=Math.sin(e.userData.dir)*e.userData.speed;

if(Math.random()<0.01){
e.userData.dir=Math.random()*Math.PI*2;
}
}

if(dist<1.5){
startBattle(e);
}
});

/* CAMERA */
camera.position.x=player.position.x;
camera.position.z=player.position.z+8;
camera.position.y=5;
camera.lookAt(player.position);

renderer.render(scene,camera);
}

animate();
updateUI();

</script>

</body>
</html>
