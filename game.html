<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English Game</title>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">        animate();
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            touch-action: none;
            background: #000;

        }

        /* ---------------- UI ---------------- */

        #ui {

            position: absolute;

            top: 10px;
            left: 10px;

            background: rgba(0, 0, 0, .6);

            color: #fff;

            padding: 10px;

            border-radius: 10px;

            z-index: 100;

            font-size: 18px;

        }

        #ui span {

            color: yellow;

        }

        /* ---------------- Battle ---------------- */

        #battleBox {

            position: absolute;

            left: 50%;

            bottom: 20px;

            transform: translateX(-50%) scale(0);

            width: 320px;

            background: rgba(0, 0, 0, .9);

            color: white;

            padding: 15px;

            border-radius: 15px;

            transition: .25s;

            z-index: 200;

        }

        #battleBox.active {

            transform: translateX(-50%) scale(1);

        }

        #battleBox button {

            width: 100%;

            padding: 10px;

            margin-top: 8px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

        }

        /* ---------------- Joystick ---------------- */

        #joystickBase {

            position: absolute;

            bottom: 35px;

            left: 35px;

            width: 130px;

            height: 130px;

            border-radius: 50%;

            background: rgba(255, 255, 255, .15);

            border: 2px solid rgba(255, 255, 255, .4);

            z-index: 150;

        }

        #joystickStick {

            position: absolute;

            width: 45px;

            height: 45px;

            left: 50%;

            top: 50%;

            border-radius: 50%;

            background: white;

            transform: translate(-50%, -50%);

        }

        /* Desktop */

        @media(min-width:900px) {

            #joystickBase {

                left: 40px;
                bottom: 40px;

            }

        }

        canvas {

            display: block;

        }
    </style>

</head>

<body>

    <div id="ui">

        Coins :
        <span id="coins">0</span>

        <br>

        Health :
        <span id="health">100</span>

    </div>

    <div id="battleBox">

        <h3>Battle</h3>

        <p id="qText"></p>

        <div id="opts"></div>

    </div>

    <div id="joystickBase">

        <div id="joystickStick"></div>

    </div>

    <script>

        /* ===================================
           GLOBAL VARIABLES
        =================================== */

        let scene;
        let camera;
        let renderer;

        let player;

        let coins = 0;
        let health = 100;

        let enemies = [];

        let battle = false;

        /* ===================================
           CREATE SCENE
        =================================== */

        scene = new THREE.Scene();

        scene.background = new THREE.Color(0x87CEEB);

        /* ===================================
           CAMERA
        =================================== */

        camera = new THREE.PerspectiveCamera(

            75,

            window.innerWidth / window.innerHeight,

            0.1,

            2000

        );

        camera.position.set(

            0,

            8,

            12

        );

        /* ===================================
           RENDERER
        =================================== */

        renderer = new THREE.WebGLRenderer({

            antialias: true

        });

        renderer.setPixelRatio(window.devicePixelRatio);

        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

        renderer.shadowMap.enabled = true;

        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        document.body.appendChild(

            renderer.domElement

        );

        /* ===================================
           LIGHTS
        =================================== */

        /* Ambient */

        const ambient =

            new THREE.AmbientLight(

                0xffffff,

                1

            );

        scene.add(

            ambient

        );

        /* Sun */

        const sun =

            new THREE.DirectionalLight(

                0xffffff,

                2

            );

        sun.position.set(

            20,

            40,

            20

        );

        sun.castShadow = true;

        sun.shadow.mapSize.width = 2048;

        sun.shadow.mapSize.height = 2048;

        scene.add(

            sun

        );

        /* Fill */

        const fill =

            new THREE.HemisphereLight(

                0xffffff,

                0x444444,

                0.8

            );

        scene.add(

            fill

        );

        /* ===================================
           WINDOW RESIZE
        =================================== */

        window.addEventListener(

            "resize",

            () => {

                camera.aspect =

                    window.innerWidth /

                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(

                    window.innerWidth,

                    window.innerHeight

                );

            }

        );

        /* ===================================
    GROUND
 =================================== */

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(300, 300),
            new THREE.MeshStandardMaterial({
                color: 0x2d8f3f
            })
        );

        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        /* ===================================
           CITY BUILDINGS
        =================================== */

        const buildingMaterial = new THREE.MeshStandardMaterial({
            color: 0x666666
        });

        for (let i = 0; i < 80; i++) {

            const w = 2 + Math.random() * 4;
            const h = 4 + Math.random() * 20;
            const d = 2 + Math.random() * 4;

            const building = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                buildingMaterial
            );

            building.castShadow = true;
            building.receiveShadow = true;

            building.position.set(
                (Math.random() - 0.5) * 250,
                h / 2,
                (Math.random() - 0.5) * 250
            );

            scene.add(building);
        }

        /* ===================================
           TREES
        =================================== */

        for (let i = 0; i < 60; i++) {

            const tree = new THREE.Group();

            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.25, 0.35, 2),
                new THREE.MeshStandardMaterial({
                    color: 0x6b3e26
                })
            );

            trunk.position.y = 1;

            const leaves = new THREE.Mesh(
                new THREE.SphereGeometry(1.2, 16, 16),
                new THREE.MeshStandardMaterial({
                    color: 0x2ecc71
                })
            );

            leaves.position.y = 2.8;

            tree.add(trunk);
            tree.add(leaves);

            tree.position.set(
                (Math.random() - 0.5) * 260,
                0,
                (Math.random() - 0.5) * 260
            );

            scene.add(tree);
        }

        /* ===================================
           PLAYER
        =================================== */

        player = new THREE.Group();

        const body = new THREE.Mesh(
            new THREE.CapsuleGeometry(0.5, 1.2, 6, 12),
            new THREE.MeshStandardMaterial({
                color: 0x0077ff
            })
        );

        body.position.y = 1;

        const head = new THREE.Mesh(
            new THREE.SphereGeometry(0.45, 20, 20),
            new THREE.MeshStandardMaterial({
                color: 0xffd4aa
            })
        );

        head.position.y = 2.2;

        const leftArm = new THREE.Mesh(
            new THREE.CylinderGeometry(0.12, 0.12, 1),
            new THREE.MeshStandardMaterial({
                color: 0x0077ff
            })
        );

        leftArm.rotation.z = Math.PI / 2;
        leftArm.position.set(-0.8, 1.3, 0);

        const rightArm = leftArm.clone();
        rightArm.position.x = 0.8;

        const leftLeg = new THREE.Mesh(
            new THREE.CylinderGeometry(0.15, 0.15, 1),
            new THREE.MeshStandardMaterial({
                color: 0x222222
            })
        );

        leftLeg.position.set(-0.25, 0.3, 0);

        const rightLeg = leftLeg.clone();
        rightLeg.position.x = 0.25;

        player.add(body);
        player.add(head);
        player.add(leftArm);
        player.add(rightArm);
        player.add(leftLeg);
        player.add(rightLeg);

        player.position.set(0, 0, 0);

        scene.add(player);

        /* ===================================
           CAMERA FOLLOW
        =================================== */

        const cameraOffset = new THREE.Vector3(
            0,
            7,
            10
        );

        function updateCamera() {

            const desired = new THREE.Vector3(
                player.position.x + cameraOffset.x,
                player.position.y + cameraOffset.y,
                player.position.z + cameraOffset.z
            );

            camera.position.lerp(desired, 0.08);

            camera.lookAt(
                player.position.x,
                player.position.y + 1.5,
                player.position.z
            );
        }

        /* ===================================
           PLAYER MOVEMENT
        =================================== */

        let keys = {};

        let moveSpeed = 0.18;
        let rotateSpeed = 0.15;

        let joyX = 0;
        let joyY = 0;

        /* Keyboard */

        document.addEventListener("keydown", (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener("keyup", (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        /* ===================================
           JOYSTICK
        =================================== */

        const joyBase = document.getElementById("joystickBase");
        const joyStick = document.getElementById("joystickStick");

        let joystickActive = false;

        joyBase.addEventListener("touchstart", () => {
            joystickActive = true;
        });

        joyBase.addEventListener("touchend", () => {

            joystickActive = false;

            joyX = 0;
            joyY = 0;

            joyStick.style.transform =
                "translate(-50%,-50%)";
        });

        joyBase.addEventListener("touchmove", (e) => {

            if (!joystickActive) return;

            e.preventDefault();

            const rect = joyBase.getBoundingClientRect();

            let x =
                e.touches[0].clientX -
                rect.left -
                rect.width / 2;

            let y =
                e.touches[0].clientY -
                rect.top -
                rect.height / 2;

            const max = 45;

            x = Math.max(-max, Math.min(max, x));
            y = Math.max(-max, Math.min(max, y));

            joyX = x / max;
            joyY = y / max;

            joyStick.style.transform =
                `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;

        });

        /* ===================================
           MOVE PLAYER
        =================================== */

        function movePlayer() {

            let dx = 0;
            let dz = 0;

            /* WASD */

            if (keys["w"]) dz -= 1;
            if (keys["s"]) dz += 1;
            if (keys["a"]) dx -= 1;
            if (keys["d"]) dx += 1;

            /* Arrow Keys */

            if (keys["arrowup"]) dz -= 1;
            if (keys["arrowdown"]) dz += 1;
            if (keys["arrowleft"]) dx -= 1;
            if (keys["arrowright"]) dx += 1;

            /* Mobile Joystick */

            dx += joyX;
            dz += joyY;

            if (dx !== 0 || dz !== 0) {

                const len = Math.hypot(dx, dz);

                dx /= len;
                dz /= len;

                player.position.x += dx * moveSpeed;
                player.position.z += dz * moveSpeed;

                player.rotation.y =
                    Math.atan2(dx, dz);

            }

        }

        /* ===================================
           ANIMATION LOOP
        =================================== */

        function animate() {

            requestAnimationFrame(animate);

            movePlayer();

            updateCamera();

            updateEnemies();

            checkBattle();

            renderer.render(scene, camera);

        }



        /* ==========================================
           ENEMY SYSTEM
        ========================================== */


        const MAX_ENEMIES = 30;

        /* ==========================================
           CREATE ENEMY
        ========================================== */

        function createEnemy(x, z) {

            const enemy = new THREE.Group();

            // Body
            const body = new THREE.Mesh(
                new THREE.CapsuleGeometry(0.55, 1.2, 6, 12),
                new THREE.MeshStandardMaterial({
                    color: 0xff3333
                })
            );

            body.position.y = 1;

            // Head
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.45, 16, 16),
                new THREE.MeshStandardMaterial({
                    color: 0xffd4aa
                })
            );

            head.position.y = 2.2;

            // Left Arm
            const leftArm = new THREE.Mesh(
                new THREE.CylinderGeometry(0.12, 0.12, 1),
                new THREE.MeshStandardMaterial({
                    color: 0xff3333
                })
            );

            leftArm.rotation.z = Math.PI / 2;
            leftArm.position.set(-0.8, 1.3, 0);

            // Right Arm
            const rightArm = leftArm.clone();
            rightArm.position.x = 0.8;

            // Left Leg
            const leftLeg = new THREE.Mesh(
                new THREE.CylinderGeometry(0.15, 0.15, 1),
                new THREE.MeshStandardMaterial({
                    color: 0x222222
                })
            );

            leftLeg.position.set(-0.25, 0.3, 0);

            // Right Leg
            const rightLeg = leftLeg.clone();
            rightLeg.position.x = 0.25;

            enemy.add(body);
            enemy.add(head);
            enemy.add(leftArm);
            enemy.add(rightArm);
            enemy.add(leftLeg);
            enemy.add(rightLeg);

            enemy.position.set(x, 0, z);

            enemy.userData = {

                speed: 0.04 + Math.random() * 0.03,

                health: 100,

                walkTime: Math.random() * 10,

                leftArm,

                rightArm,

                leftLeg,

                rightLeg,

                head

            };

            scene.add(enemy);

            enemies.push(enemy);

        }

        /* ==========================================
           SPAWN ENEMIES
        ========================================== */

        function spawnEnemies() {

            for (let i = 0; i < MAX_ENEMIES; i++) {

                createEnemy(

                    (Math.random() - 0.5) * 220,

                    (Math.random() - 0.5) * 220

                );

            }

        }

        spawnEnemies();
        /* ==========================================
           ENEMY AI
        ========================================== */

        function updateEnemies() {

            enemies.forEach(enemy => {

                let dx =
                    player.position.x -
                    enemy.position.x;

                let dz =
                    player.position.z -
                    enemy.position.z;

                let dist = Math.sqrt(
                    dx * dx + dz * dz
                );

                /* Follow Player */

                if (dist > 0 && dist < 40) {

    dx /= dist;
    dz /= dist;

    enemy.position.x += dx * enemy.userData.speed;
    enemy.position.z += dz * enemy.userData.speed;

    enemy.rotation.y = Math.atan2(dx, dz);

}
else{

    enemy.rotation.y += 0.01;

}
                /* Walking Animation */

                enemy.userData.walkTime += 0.15;

                const walk =
                    Math.sin(
                        enemy.userData.walkTime
                    ) * 0.7;

                enemy.userData.leftArm.rotation.x =
                    walk;

                enemy.userData.rightArm.rotation.x =
                    -walk;

                enemy.userData.leftLeg.rotation.x =
                    -walk;

                enemy.userData.rightLeg.rotation.x =
                    walk;

                enemy.userData.head.position.y =
                    2.2 +
                    Math.sin(
                        enemy.userData.walkTime * 2
                    ) * 0.05;


                enemy.position.y =

                    Math.sin(

                        Date.now() * 0.004 +

                        enemy.userData.walkTime

                    ) * 0.08;
            });



        }

        /* ==========================================
           BATTLE SYSTEM
        ========================================== */

        let currentEnemy = null;

        /* Sample Questions
           (પછી 100+ Questions અહીં ઉમેરતા જઈશું)
        */

        const questions = [

            {
                q: "2 + 2 = ?",
                o: ["3", "4", "5"],
                a: 1
            },

            {
                q: "Capital of India?",
                o: ["Delhi", "Mumbai", "Surat"],
                a: 0
            },

            {
                q: "Sun is a ?",
                o: ["Planet", "Star", "Moon"],
                a: 1
            },

            {
                q: "Water Formula?",
                o: ["CO2", "H2O", "O2"],
                a: 1
            },

            {
                q: "5 x 2 = ?",
                o: ["10", "8", "12"],
                a: 0
            }

        ];

        /* ==========================================
           START BATTLE
        ========================================== */

        function startBattle(enemy) {

            if (battle) return;

            battle = true;

            currentEnemy = enemy;

            const q =
                questions[
                Math.floor(
                    Math.random() * questions.length
                )
                ];

            currentEnemy.userData.question = q;

            document
                .getElementById("battleBox")
                .classList
                .add("active");

            document
                .getElementById("qText")
                .innerHTML = q.q;

            const opts =
                document.getElementById("opts");

            opts.innerHTML = "";

            q.o.forEach((text, index) => {

                const btn =
                    document.createElement("button");

                btn.innerHTML = text;

                btn.onclick = () => {

                    answerQuestion(index);

                };

                opts.appendChild(btn);

            });

        }

        /* ==========================================
           ANSWER
        ========================================== */

        function answerQuestion(index) {

            if (!currentEnemy) return;

            const q =
                currentEnemy.userData.question;

            if (index === q.a) {

                coins += 10;
                updateCoins();

                explosion(

                    currentEnemy.position.x,

                    currentEnemy.position.y,

                    currentEnemy.position.z

                );

                scene.remove(currentEnemy);

                enemies = enemies.filter(
                    e => e !== currentEnemy
                );

                setTimeout(()=>{

    respawnEnemy();

},3000);

            }

            else {

                health -= 10;
                updateHealth();

                if (health < 0)
                    health = 0;
                updateHealth();

                if (health <= 0) {

                    alert("GAME OVER");

                    location.reload();

                }

            }

            currentEnemy = null;

            battle = false;

            document
                .getElementById("battleBox")
                .classList
                .remove("active");

        }

        /* ==========================================
           CHECK DISTANCE
        ========================================== */

        function checkBattle() {

            if (battle) return;

            enemies.forEach(enemy => {

                const d =
                    player.position.distanceTo(
                        enemy.position
                    );

                if (d < 2) {

                    startBattle(enemy);

                }

            });

        }

        /* ==========================================
           EXPLOSION
        ========================================== */

        function explosion(x, y, z) {

            for (let i = 0; i < 20; i++) {

                const p = new THREE.Mesh(

                    new THREE.SphereGeometry(0.08, 8, 8),

                    new THREE.MeshBasicMaterial({
                        color: 0xffaa00
                    })

                );

                p.position.set(x, y + 1, z);

                scene.add(p);

                const vx = (Math.random() - 0.5) * 0.35;
                const vy = Math.random() * 0.25;
                const vz = (Math.random() - 0.5) * 0.35;

                let t = 0;

                const id = setInterval(() => {

                    p.position.x += vx;
                    p.position.y += vy;
                    p.position.z += vz;

                    t++;

                    if(t>25){

    clearInterval(id);

    scene.remove(p);

}

                }, 16);

            }

        }






        
        function updateCoins() {
            document.getElementById("coins").textContent = coins;
        }

        function updateHealth() {
            document.getElementById("health").textContent = health;
        }

        /* ==========================================
           RESPAWN
        ========================================== */

        function respawnEnemy() {

            createEnemy(

                (Math.random() - 0.5) * 220,

                (Math.random() - 0.5) * 220

            );

        }
            animate();
    </script>

</body>

</html>
