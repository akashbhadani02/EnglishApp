<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦜</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(to top,#87CEEB,#dff8ff);
}

/* Sky */
.sky{
position:fixed;
width:100%;
height:100%;
left:0;
top:0;
overflow:hidden;
z-index:0;
}

/* Clouds */
.cloud{
position:absolute;
font-size:70px;
opacity:.8;
animation:cloudMove linear infinite;
}

.cloud:nth-child(1){
top:10%;
left:-200px;
animation-duration:40s;
}

.cloud:nth-child(2){
top:30%;
left:-300px;
animation-duration:55s;
}

.cloud:nth-child(3){
top:60%;
left:-250px;
animation-duration:48s;
}

@keyframes cloudMove{
0%{
transform:translateX(0);
}
100%{
transform:translateX(calc(100vw + 500px));
}
}

/* Flying Parrot */
.parrot{
position:fixed;
left:-150px;
top:20%;
font-size:90px;
z-index:100;
pointer-events:none;
animation:
fly 16s linear infinite,
flap .35s ease-in-out infinite alternate,
floatBird 2s ease-in-out infinite;
}

@keyframes fly{

0%{
left:-150px;
top:18%;
transform:scaleX(1);
}

20%{
top:8%;
}

40%{
top:30%;
}

49%{
left:105%;
transform:scaleX(1);
}

50%{
left:105%;
transform:scaleX(-1);
}

70%{
top:15%;
}

90%{
top:35%;
}

100%{
left:-150px;
top:18%;
transform:scaleX(-1);
}

}

@keyframes flap{
from{
rotate:-8deg;
}
to{
rotate:8deg;
}
}

@keyframes floatBird{
0%{margin-top:0;}
50%{margin-top:-12px;}
100%{margin-top:0;}
}

/* Game Box */

.game{

position:relative;
z-index:10;

width:520px;
max-width:95%;

background:white;

padding:25px;

border-radius:25px;

box-shadow:0 20px 40px rgba(0,0,0,.3);

text-align:center;

}

h1{

color:#2c3e50;
margin-bottom:10px;

}

.info{

font-size:18px;
margin-bottom:15px;

}

#sentence{

min-height:70px;

font-size:26px;

font-weight:bold;

color:#1976d2;

display:flex;

justify-content:center;

align-items:center;

padding:15px;

border-radius:12px;

background:#eef8ff;

margin-bottom:20px;

}

.buttons{

display:flex;

justify-content:center;

gap:10px;

flex-wrap:wrap;

}

button{

padding:14px 24px;

font-size:18px;

border:none;

border-radius:12px;

cursor:pointer;

transition:.3s;

color:white;

}

.next{

background:#27ae60;

}

.next:hover{

background:#219150;

}

.repeat{

background:#e67e22;

}

.repeat:hover{

background:#cf6f18;

}

#mic{

display:none;

font-size:32px;

margin-top:20px;

animation:blink .6s infinite;

}

@keyframes blink{

50%{

opacity:.2;

}

}

#result{

margin-top:20px;

font-size:22px;

min-height:60px;

}

.score{

margin-top:15px;

font-size:18px;

font-weight:bold;

color:#555;

}

/* Mobile */

@media(max-width:600px){

.parrot{

font-size:70px;

}

#sentence{

font-size:21px;

}

button{

width:100%;

}

.buttons{

display:block;

}

.buttons button{

margin-top:10px;

}

}
</style>
</head>

<body>

<div class="sky">

<div class="cloud">☁️</div>
<div class="cloud">☁️</div>
<div class="cloud">☁️</div>

</div>

<div class="parrot">
🦜
</div>

<div class="game">

<h1>🦜 Speaking practice</h1>

<div class="info">
Press <b>Next Sentence</b><br>
Listen Carefully & Repeat
</div>

<div id="sentence">
Loading...
</div>

<div class="buttons">

<button class="next" onclick="nextSentence()">
🔊 Next Sentence
</button>

<button class="repeat" onclick="startSpeech()">
🎤 Repeat
</button>

</div>

<div id="mic">
🎙️ Listening...
</div>

<div id="result"></div>

<div class="score">
Sentence:
<span id="count">1</span>
/
<span id="total">30</span>
</div>

<script>
   /* =========================================================
   ENHANCED BASIC PROTECTION
========================================================= */

document.addEventListener(
    "contextmenu",
    function (event) {
        event.preventDefault();
    }
);

document.addEventListener(
    "dragstart",
    function (event) {
        event.preventDefault();
    }
);

document.addEventListener(
    "keydown",
    function (event) {
        // Prevent Ctrl+S, Ctrl+U
        if (
            event.ctrlKey &&
            (
                event.key.toLowerCase() === "s" ||
                event.key.toLowerCase() === "u"
            )
        ) {
            event.preventDefault();
        }

        // Prevent F12
        if (event.key === "F12") {
            event.preventDefault();
        }

        // Prevent Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C
        if (
            event.ctrlKey &&
            event.shiftKey &&
            (
                event.key.toLowerCase() === "i" ||
                event.key.toLowerCase() === "j" ||
                event.key.toLowerCase() === "c"
            )
        ) {
            event.preventDefault();
        }
    }
);
   const sentences = [
"I wake up early to make the most of my day",
"Good communication builds strong relationships",
"I enjoy listening to motivational speeches",
"I believe every mistake helps me improve",
"I practice English every morning without fail",
"My family always supports my dreams",
"I like to keep my workspace clean and organized",
"I enjoy traveling to new places and learning about them",
"Reading books improves my vocabulary and imagination",
"I try to maintain a healthy lifestyle every day",
"I respect people who are kind and honest",
"I am becoming a better version of myself",
"I never give up when things become difficult",
"I enjoy learning from successful people",
"My confidence grows with every conversation",
"I believe discipline leads to long-term success",
"I enjoy sharing my knowledge with others",
"I always try to think before I speak",
"I am grateful for every opportunity I receive",
"I enjoy spending quality time with my family",
"Success starts with a positive mindset",
"I believe teamwork makes difficult tasks easier",
"I enjoy challenging myself with new goals",
"I stay motivated by remembering my dreams",
"I believe patience brings better results",
"I enjoy speaking English with my friends",
"I always try to learn from my failures",
"I believe practice makes everything easier",
"I enjoy setting goals and achieving them",
"Every new day gives me another chance to improve",
"I enjoy solving puzzles in my free time",
"I always respect other people's opinions",
"I believe kindness can change the world",
"I enjoy learning new words every day",
"My confidence increases with daily practice",
"I always try to stay focused on my work",
"I believe education opens many doors",
"I enjoy watching educational videos online",
"I try to be honest in every situation",
"I enjoy spending time in nature",
"I like to keep learning throughout my life",
"I believe positive thinking creates positive results",
"I enjoy working on challenging projects",
"I always finish what I start",
"I like making new friends from different countries",
"I enjoy reading inspiring stories",
"I believe that everyone has unique talents",
"I like improving my speaking skills every day",
"I always stay curious about new things",
"I believe good habits create a better future",
"I enjoy participating in group discussions",
"I try to use English whenever possible",
"I believe confidence comes from experience",
"I enjoy learning from my teachers",
"I like asking questions to gain knowledge",
"I always manage my time wisely",
"I believe success is a journey, not a destination",
"I enjoy helping my classmates with their studies",
"I like keeping a positive attitude",
"I always try to improve my pronunciation",
"I enjoy practicing English conversations daily",
"I believe every person can achieve greatness",
"I like writing down my daily goals",
"I enjoy working hard to achieve success",
"I always try to stay healthy and active",
"I believe self-confidence is the key to happiness",
"I enjoy making every day productive",
"I like encouraging others to do their best",
"I always believe in myself",
"I enjoy turning my dreams into reality",
"I believe learning never stops"
];

let index = 0;

document.getElementById("total").innerText = sentences.length;

function speak(text){

speechSynthesis.cancel();

const speech = new SpeechSynthesisUtterance(text);

speech.lang = "en-US";
speech.rate = 0.9;
speech.pitch = 1;
speech.volume = 1;

speechSynthesis.speak(speech);

}

function nextSentence(){

document.getElementById("result").innerHTML = "";

document.getElementById("sentence").innerHTML =
sentences[index];

document.getElementById("count").innerHTML =
index+1;

speak(sentences[index]);

}

function normalize(str){

return str
.toLowerCase()
.replace(/[.,!?]/g,"")
.replace(/\s+/g," ")
.trim();

}

function startSpeech(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert("Please use Google Chrome");

return;

}

const recognition = new SpeechRecognition();

recognition.lang = "en-US";
recognition.continuous = false;
recognition.interimResults = false;
recognition.maxAlternatives = 1;

document.getElementById("mic").style.display = "block";

recognition.start();

recognition.onresult = function(e){

document.getElementById("mic").style.display = "none";

const spoken =
e.results[0][0].transcript;

document.getElementById("result").innerHTML =
"<b>You Said:</b><br>"+spoken;

if(
normalize(spoken) ===
normalize(sentences[index])
){

document.getElementById("result").innerHTML +=
"<br><br>✅ Excellent!";

index++;

if(index >= sentences.length){

setTimeout(()=>{

alert("🎉 Congratulations!\nYou completed all sentences.");

index = 0;

nextSentence();

},700);

}else{

setTimeout(()=>{

nextSentence();

},700);

}

}else{

document.getElementById("result").innerHTML +=
"<br><br>❌ Try Again";

setTimeout(()=>{

speak(sentences[index]);

},1000);

}

};

recognition.onerror = function(){

document.getElementById("mic").style.display = "none";

alert("🎤 Microphone Error");

};

recognition.onend = function(){

document.getElementById("mic").style.display = "none";

};

}

window.onload = function(){

nextSentence();

};
</script>

</body>
</html>
