<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>English Learning Game</title>
    <style>
        body {
            margin: 0;
            background: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #cursor {
            position: absolute;
            width: 25px;
            height: 25px;
            background: #0f0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 15px #0f0;
        }

        #status {
            position: fixed;
            top: 20px;
            z-index: 200;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid #fff;
        }

        #btn-start {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background: #0f0;
            border: none;
            border-radius: 10px;
            margin-top: 100px;
        }

        .word-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 80px 20px;
            display: none;
        }

        .word {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            border: 2px solid #fff;
            border-radius: 12px;
            background: #333;
            width: 100px;
            text-align: center;
        }

        .word img {
            width: 50px;
            height: 50px;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <button id="btn-start">Start Camera</button>
    <div id="status"></div>
    <div id="cursor"></div>
    <div class="word-container" id="container"></div>
    <video id="v" autoplay playsinline style="display:none;"></video>

    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>

            { name: "Hand", img: "https://img.icons8.com/color/96/hand.png" },

            { name: "Egg", img: "https://img.icons8.com/color/96/egg.png" },
            { name: "Bread", img: "https://img.icons8.com/color/96/bread.png" },
            { name: "Burger", img: "https://img.icons8.com/color/96/hamburger.png" },
            { name: "Sandwich", img: "https://img.icons8.com/color/96/sandwich.png" },
            { name: "Noodles", img: "https://img.icons8.com/color/96/noodles.png" },
            { name: "Rice", img: "https://img.icons8.com/color/96/rice-bowl.png" },
            { name: "Cheese", img: "https://img.icons8.com/color/96/cheese.png" },
            { name: "Cookie", img: "https://img.icons8.com/color/96/cookie.png" },
            { name: "Donut", img: "https://img.icons8.com/color/96/doughnut.png" },
            { name: "Candy", img: "https://img.icons8.com/color/96/candy.png" },
            { name: "Pencil", img: "https://img.icons8.com/color/96/pencil.png" },
            { name: "Eraser", img: "https://img.icons8.com/color/96/eraser.png" },
            { name: "Ruler", img: "https://img.icons8.com/color/96/ruler.png" },
            { name: "Scissors", img: "https://img.icons8.com/color/96/scissors.png" }
        ];

        const container = document.getElementById('container');
        const btnStart = document.getElementById('btn-start');
        const status = document.getElementById('status');
        const v = document.getElementById('v');

        wordsList.forEach(item => {
            const div = document.createElement('div');
            div.className = 'word';
            div.innerHTML = `<img src="${item.img}"><span>${item.name}</span>`;
            container.appendChild(div);
        });

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(r => {
            if (r.multiHandLandmarks && r.multiHandLandmarks.length > 0) {
                status.innerText = "હાથ ટ્રેક થઈ રહ્યો છે!";
                const lm = r.multiHandLandmarks[0][8];
                const x = (1 - lm.x) * window.innerWidth;
                const y = lm.y * window.innerHeight;
                document.getElementById('cursor').style.left = (x - 12) + 'px';
                document.getElementById('cursor').style.top = (y - 12) + 'px';

                document.querySelectorAll('.word').forEach(w => {
                    const rect = w.getBoundingClientRect();
                    if (x > rect.left && x < rect.right && y > rect.top && y < rect.bottom) {
                        if (!window.speechSynthesis.speaking) {
                            const u = new SpeechSynthesisUtterance(w.querySelector('span').innerText);
                            window.speechSynthesis.speak(u);
                        }
                    }
                });
            } else {
                status.innerText = "હાથ કેમેરા સામે લાવો...";
            }
        });

        btnStart.addEventListener('click', async () => {
            btnStart.style.display = 'none';
            container.style.display = 'flex';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                v.srcObject = stream;
                const cam = new Camera(v, {
                    onFrame: async () => { await hands.send({ image: v }); },
                    width: 640,
                    height: 480
                });
                await cam.start();
            } catch (e) {
                status.innerText = "Error: " + e.message;
            }
        });
    </script>
</body>

</html>
