<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Zoom Meeting</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#0B5CFF,#00B8FF);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#fff;
    width:420px;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

img{
    width:90px;
    margin-bottom:15px;
}

h2{
    color:#0B5CFF;
    margin-bottom:10px;
}

p{
    color:#666;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    font-size:16px;
    margin-bottom:15px;
}

input:focus{
    border-color:#0B5CFF;
    outline:none;
}

button{
    width:100%;
    padding:14px;
    background:#0B5CFF;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0848c9;
}

.footer{
    margin-top:20px;
    color:#888;
    font-size:14px;
}
</style>

</head>
<body>

<div class="container">

<img src="https://a57.foxnews.com/static.foxbusiness.com/foxbusiness.com/content/uploads/2020/04/0/0/Kid-Laptop-iStock-1.jpg?ve=1&tl=1">

<h2>Zoom Meeting</h2>

<p>Paste your Zoom meeting link below.</p>

<input
type="url"
id="zoomLink"
placeholder="https://us05web.zoom.us/j/xxxxxxxxxxx"
>

<button onclick="joinMeeting()">Join Meeting</button>

<div class="footer">
Powered by Zoom
</div>

</div>

<script>
function joinMeeting(){

let link=document.getElementById("zoomLink").value.trim();

if(link===""){
    alert("Please enter a Zoom Meeting Link.");
    return;
}

if(
link.startsWith("https://") ||
link.startsWith("zoommtg://")
){
    window.open(link,"_blank");
}else{
    alert("Please enter a valid Zoom Meeting URL.");
}

}
</script>

</body>
</html>
