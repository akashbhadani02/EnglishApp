        }

        .container {

        }

            margin: 10px 0;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        .startBtn {
            background: #27ae60;
            color: white;
            width: 100%;
        }

        #quizSection {
            display: none;
        }

        #progressText {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .progress {
            height: 18px;
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #27ae60;
            transition: .4s;
        }

        #timer {
            font-size: 22px;
            font-weight: bold;
            text-align: right;
            color: #e74c3c;
            margin-bottom: 15px;
        }

        #question {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .option {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
        }

        .option:hover {
            background: #2980b9;
        }

        .correct {
            background: #27ae60 !important;
        }

        .wrong {
            background: #e74c3c !important;
        }

        #scoreBoard {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        #certificate {
            display: none;
            padding: 30px;
            text-align: center;
            border: 10px solid gold;
            border-radius: 20px;
        }

        #certificate h2 {
            font-size: 40px;
            color: green;
            margin-bottom: 20px;
        }

        #certificate h3 {
            font-size: 28px;
            margin: 15px 0;
        }

        #printBtn {
            background: #27ae60;
            color: white;
            margin-top: 20px;
        }

        body {
            user-select: none;
        }

        /* certificate */
        #certificate {
            display: none;
            padding: 20px;
        }

        .cert-box {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 40px;
            border: 10px double gold;
            border-radius: 20px;
            text-align: center;

        .cert-box h2 {

            color: #27ae60;

            color: #34495e;
            margin: 10px 0;

        .line {

            font-size: 16px;
            margin: 10px 0;

            font-size: 18px;
            color: #222;

            background: #27ae60;
            color: white;
            border-radius: 10px;

                font-size: 22px;
            }

            .signs {
                justify-content: center;
            }

        @media print {

            body * {
                visibility: hidden;
            }

            #certificate,
            #certificate * {
                visibility: visible;
            }

            #certificate {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
            }

            /* Q&A Hide */
            #reviewSection,
            #reviewSection * {
                display: none !important;

            /* Buttons Hide */
            #downloadQA,
            #certificateBtn {

            }

        #downloadBtn,

            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;

        #reviewSection {
            margin-top: 30px;
            overflow-x: auto;
        }

        #reviewTable {
            width: 100%;
            border-collapse: collapse;
        }

        #reviewTable th {
            background: #27ae60;
            color: white;
            padding: 10px;
        }

        #reviewTable td {
            padding: 8px;
            text-align: left;
        }
    </style>
</head>

        function removeDuplicateQuestions(arr) {
            const seen = new Set();

            return arr.filter(q => {
                const key = q.q.trim().toLowerCase();

                if (seen.has(key)) {
                    return false;
                }

                seen.add(key);
                return true;
            });
        }

        let timer = 30;
        let timerInterval;
        let studentName = "";
        let reviewData = [];

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startExam() {

            studentName =
                document.getElementById("studentName").value.trim();

            if (studentName === "") {
                alert("Please enter student name");
                return;
            }

            document.getElementById("studentSection").style.display = "none";
            document.getElementById("quizSection").style.display = "block";

            shuffleArray(questions);
            questions = shuffleArray(
                removeDuplicateQuestions(allQuestions)
            ).slice(0, 100);

            loadQuestion();
        }

        function loadQuestion() {

            if (currentQuestion >= questions.length) {
                finishExam();
                return;
            }

            let q = questions[currentQuestion];

            document.getElementById("progressText").innerHTML =
                `Question ${currentQuestion + 1} of ${questions.length}`;

            document.getElementById("progressBar").style.width =
                ((currentQuestion / questions.length) * 100) + "%";

            document.getElementById("question").innerHTML = q.q;

            let options = [...q.options];
            shuffleArray(options);

            let html = "";

            options.forEach(option => {

                html += `
        <button class="option"
        onclick="checkAnswer('${option}')">
        ${option}
        </button>
        `;

            });

            document.getElementById("options").innerHTML = html;

            startTimer();
        }

        function startTimer() {

            clearInterval(timerInterval);

            timer = 30;

            document.getElementById("timer").innerHTML =
                `⏳ ${timer}`;

            timerInterval = setInterval(() => {

                timer--;

                document.getElementById("timer").innerHTML =
                    `⏳ ${timer}`;

                if (timer <= 0) {

                    clearInterval(timerInterval);

                    let q = questions[currentQuestion];

                    reviewData.push({
                        question: q.q,
                        selected: "No Answer",
                        correct: q.answer
                    });

                    currentQuestion++;

                    loadQuestion();
                }

            }, 1000);
        }

        function checkAnswer(selected) {

            clearInterval(timerInterval);

            let q = questions[currentQuestion];

            let buttons =
                document.querySelectorAll(".option");

            buttons.forEach(btn => {

                btn.disabled = true;

                if (btn.innerText === q.answer) {
                    btn.classList.add("correct");
                }

                if (
                    btn.innerText === selected &&
                    selected !== q.answer
                ) {
                    btn.classList.add("wrong");
                }

            });

            reviewData.push({
                question: q.q,
                selected: selected,
                correct: q.answer
            });

            if (selected === q.answer) {

                score++;

                let sound =
                    document.getElementById("correctSound");

                if (sound) sound.play();

            } else {

                let sound =
                    document.getElementById("wrongSound");

                if (sound) sound.play();

            }

            document.getElementById("scoreBoard").innerHTML =
                `Score: ${score}`;

            currentQuestion++;

            setTimeout(loadQuestion, 1200);
        }

            user.examResults.push({
                userName: user.name,
                score: score,
                total: questions.length,
                percentage: percentage,
                grade: certGrade,
                date: new Date().toLocaleString()
            });

            user.examScore = score;
            user.percentage = percentage;
            user.grade = certGrade;

            students = students.map(s => {

                if (s.id === user.id) {

                    s.examResults = user.examResults;
                    s.examScore = score;
                    s.percentage = percentage;
                    s.grade = certGrade;
                }

                return s;
            });

            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );

            localStorage.setItem(
                "currentStudent",
                JSON.stringify(user)
            );

            let tbody =
                document.querySelector("#reviewTable tbody");

            let html = "";

            reviewData.forEach((r, index) => {

                html += `
<tr style="${r.selected !== r.correct
                        ? 'background:#ffe5e5;'
                        : 'background:#e8ffe8;'
                    }">
<td>${index + 1}</td>
<td>${r.question}</td>
<td style="color:${r.selected !== r.correct ? 'red' : 'green'
                    };font-weight:bold;">
${r.selected}
</td>
<td style="color:green;font-weight:bold;">
${r.correct}
</td>
</tr>
`;

            });

            tbody.innerHTML = html;

            document.getElementById("reviewSection").style.display =
                "block";

        }


        document.addEventListener("contextmenu", e => {
            e.preventDefault();
        });



        document.addEventListener("copy", e => {
            e.preventDefault();
            alert("⚠ Copying is not allowed.");
        });

        document.addEventListener("selectstart", e => {
            e.preventDefault();
        });







        document.addEventListener("click", function (e) {

            if (e.target.id === "downloadQA") {


                let content = "EXAM REPORT\n\n";

                content += "========================\n";
                content += "✅ CORRECT ANSWERS\n";
                content += "========================\n\n";

                reviewData.forEach((r, index) => {

                    if (r.selected === r.correct) {

                        content += (index + 1) + ". " + r.question + "\n";
                        content += "Your Answer: " + r.selected + "\n";
                        content += "Correct Answer: " + r.correct + "\n";
                        content += "-------------------------\n\n";

                    }

                });

                content += "\n\n========================\n";
                content += "❌ WRONG ANSWERS\n";
                content += "========================\n\n";

                reviewData.forEach((r, index) => {

                    if (r.selected !== r.correct) {

                        content += (index + 1) + ". " + r.question + "\n";
                        content += "Your Answer: " + r.selected + "\n";
                        content += "Correct Answer: " + r.correct + "\n";
                        content += "-------------------------\n\n";

                    }

                });

                const blob = new Blob([content], {
                    type: "text/plain"
                });

                const a = document.createElement("a");

                a.href = URL.createObjectURL(blob);

                a.download = "Exam_Report.txt";

                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);


            }


        });
    </script>
