<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <title>Topic-Based English Learning</title>
   <style>
    /* ગ્લોબલ સ્ટાઈલ */
    body { 
        font-family: 'Segoe UI', Roboto, sans-serif; 
        text-align: center; 
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px; /* નાની સ્ક્રીન માટે પેડિંગ */
    }

    /* કન્ટેનર સ્ટાઈલ (Responsive) */
    .container { 
        background: white; 
        padding: 30px; 
        border-radius: 25px; 
        box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
        width: 100%; 
        max-width: 450px; /* મોટી સ્ક્રીન પર બહુ મોટી નહીં થાય */
        box-sizing: border-box; /* પેડિંગને કારણે પહોળાઈ ન વધે તે માટે */
    }

    /* હેડિંગ રિસ્પોન્સિવ */
    h1 { font-size: 1.5rem; color: #333; margin-bottom: 20px; }

    /* બટન સ્ટાઈલ */
    .btn { 
        display: block; 
        width: 100%; 
        padding: 14px; 
        margin: 10px 0; 
        border: none; 
        background: #4e54c8; 
        color: white; 
        border-radius: 12px; 
        cursor: pointer; 
        font-size: 1rem; 
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .btn:hover { background: #8f94fb; transform: translateY(-2px); }

    .topic-btn { background: #f8f9fa; color: #4e54c8; border: 2px solid #4e54c8; }
    .topic-btn:hover { background: #4e54c8; color: white; }

    /* ટેબ્લેટ અને મોબાઈલ માટે રિસ્પોન્સિવ ટ્વીક્સ */
    @media (max-width: 480px) {
        .container { padding: 20px; }
        h1 { font-size: 1.2rem; }
        .btn { padding: 12px; font-size: 0.9rem; }
    }
</style>
</head>

    let currentTopic = "";
    let currentIdx = 0;

    function startTopic(topic) {
        currentTopic = topic;
        currentIdx = 0;
        document.getElementById("main").innerHTML = `
            <h2 id="q-text"></h2>
            <button class="btn" style="background:#ffc107; color:black" onclick="speakText()">🔊 સાંભળો</button>
            <div id="opts"></div>
        `;
        loadQ();
    }

    function loadQ() {
        const data = topics[currentTopic][currentIdx];
        document.getElementById("q-text").innerText = data.q;
        const optsDiv = document.getElementById("opts");
        optsDiv.innerHTML = "";
        data.options.forEach(o => {
            const b = document.createElement("button");
            b.className = "btn";
            b.innerText = o;
            b.onclick = () => {
                alert(o === data.correct ? "સાચું! 🎉" : "ખોટું, સાચો જવાબ છે: " + data.correct);
                currentIdx++;
                if(currentIdx < topics[currentTopic].length) loadQ();
                else location.reload();
            };
            optsDiv.appendChild(b);
        });
    }

    function speakText() {
        const msg = new SpeechSynthesisUtterance(topics[currentTopic][currentIdx].q);
        window.speechSynthesis.speak(msg);
    }
</script>
