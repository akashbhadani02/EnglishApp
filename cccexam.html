<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            width: 100%;
            max-width: 900px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .2);
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
        }

        #studentSection {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        .startBtn {
            background: #27ae60;
            color: white;
            width: 100%;
        }

        #quizSection {
            display: none;
        }

        #progressText {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .progress {
            height: 18px;
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #27ae60;
            transition: .4s;
        }

        #timer {
            font-size: 22px;
            font-weight: bold;
            text-align: right;
            color: #e74c3c;
            margin-bottom: 15px;
        }

        #question {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .option {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
        }

        .option:hover {
            background: #2980b9;
        }

        .correct {
            background: #27ae60 !important;
        }

        .wrong {
            background: #e74c3c !important;
        }

        #scoreBoard {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        #certificate {
            display: none;
            padding: 30px;
            text-align: center;
            border: 10px solid gold;
            border-radius: 20px;
        }

        #certificate h2 {
            font-size: 40px;
            color: green;
            margin-bottom: 20px;
        }

        #certificate h3 {
            font-size: 28px;
            margin: 15px 0;
        }

        #printBtn {
            background: #27ae60;
            color: white;
            margin-top: 20px;
        }

        body {
            user-select: none;
        }

        /* certificate */
        #certificate {
            display: none;
            padding: 20px;
        }

        .cert-box {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 40px;
            border: 10px double gold;
            border-radius: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .cert-box h1 {
            color: #2c3e50;
            margin: 10px 0;
            font-size: 32px;
        }

        .cert-box h2 {
            font-size: 30px;
            color: #27ae60;
            margin: 20px 0;
            border-bottom: 2px solid #27ae60;
            display: inline-block;
            padding: 5px 20px;
        }

        .cert-box h3 {
            color: #34495e;
            margin: 10px 0;
        }

        .line {
            color: #555;
            font-size: 16px;
            margin: 10px 0;
        }

        .resultBox {
            margin-top: 20px;
            font-size: 18px;
            color: #222;
        }

        .signs {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .signs div {
            border-top: 2px solid black;
            width: 180px;
            padding-top: 5px;
        }

        #printBtn {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            background: #27ae60;
            color: white;
            border-radius: 10px;
            cursor: pointer;
        }

        /* RESPONSIVE */
        @media(max-width:600px) {
            .cert-box {
                padding: 20px;
            }

            .cert-box h1 {
                font-size: 22px;
            }

            .cert-box h2 {
                font-size: 22px;
            }

            .signs {
                justify-content: center;
            }
        }

        /* PRINT FIX */
        @media print {

            body * {
                visibility: hidden;
            }

            #certificate,
            #certificate * {
                visibility: visible;
            }

            #certificate {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
            }

            /* Q&A Hide */
            #reviewSection,
            #reviewSection * {
                display: none !important;
                visibility: hidden !important;
            }

            /* Buttons Hide */
            #downloadQA,
            #certificateBtn {
                display: none !important;
            }
        }

        #downloadBtn,
        #certificateBtn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        #reviewSection {
            margin-top: 30px;
            overflow-x: auto;
        }

        #reviewTable {
            width: 100%;
            border-collapse: collapse;
        }

        #reviewTable th {
            background: #27ae60;
            color: white;
            padding: 10px;
        }

        #reviewTable td {
            padding: 8px;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="studentSection">

            <h1>📚 CCC Practice Exam</h1>

            <input id="studentName" placeholder="Enter student full Name (Surname,Name,Father's name)">

            <button class="startBtn" onclick="startExam()">
                Start Exam
            </button>

        </div>

        <div id="quizSection">

            <div id="progressText"></div>

            <div class="progress">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <div id="timer">30</div>

            <div id="question"></div>

            <div id="options"></div>

            <div id="scoreBoard">
                Score: 0
            </div>

        </div>

        <div id="certificate">

            <div class="cert-box">

                <img id="schoolLogo" src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" width="80">

                <h1>🏆 CERTIFICATE OF ACHIEVEMENT</h1>

                <p class="line">This is proudly awarded to</p>

                <h2 id="certName">Student Name</h2>

                <p class="line">For successfully completing</p>

                <h3>CCC Exam</h3>

                <div class="resultBox">

                    <p id="certPercent"></p>
                    <p id="certStatus"></p>
                    <p id="certGrade"></p>
                    <p id="certDate"></p>

                </div>

                <div class="signs">
                    <div>Teacher Signature</div>
                    <div>Principal Signature</div>
                </div>

                <!-- <button id="printBtn" onclick="window.print()">🖨 Print Certificate</button> -->


                <button id="downloadQA" style="background:#f39c12;color:white;margin:5px;">
                    📄 Download Q & A
                </button>

                <button onclick="window.open('ccccertificate.html','_blank')"
                    style="background:#3498db;color:white;margin:5px;">
                    🏆 Open Certificate
                </button>


            </div> <!-- cert-box -->
        </div> <!-- certificate -->
        <div id="reviewSection" style="display:none;margin-top:30px;">

            <h2>📊 Answer Review</h2>

            <table border="1" width="100%" id="reviewTable">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Question</th>
                        <th>Your Answer</th>
                        <th>Correct Answer</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

        </div>
    </div> <!-- container -->


    </div>

    </div>
    <script>

        // Print Screen Detection
        document.addEventListener("keyup", function (e) {

            if (e.key === "PrintScreen") {

                cheatCount++;

                navigator.clipboard.writeText("");

                alert("⚠ Screenshot detected! Cheating attempt: " + cheatCount);

                if (cheatCount >= 3) {
                    alert("❌ Exam terminated due to cheating.");
                    finishExam();
                }
            }
        });

        // Windows Snipping Tool (partial detection)
        document.addEventListener("keydown", function (e) {

            if (
                e.key === "PrintScreen" ||
                (e.ctrlKey && e.shiftKey && e.key === "S")
            ) {

                cheatCount++;

                alert("⚠ Screenshot tool detected!");

                if (cheatCount >= 3) {
                    alert("❌ Exam terminated due to cheating.");
                    finishExam();
                }
            }
        });

        let cheatCount = 0;

        const allQuestions = [
{ 
    q: "Which component is responsible for processing instructions? (Instructions પર પ્રક્રિયા કરવા માટે કયો Component જવાબદાર છે?)", 
    options: [
        "CPU (સીપીયુ)",
        "Monitor (મોનિટર)",
        "Keyboard (કીબોર્ડ)",
        "Printer (પ્રિન્ટર)"
    ], 
    answer: "CPU (સીપીયુ)" 
},

{ 
    q: "Which component is used to temporarily store data while the computer is running? (કમ્પ્યુટર ચાલુ હોય ત્યારે Data ને અસ્થાયી રીતે Store કરવા માટે કયો Component વપરાય છે?)", 
    options: [
        "RAM (રેમ)",
        "ROM (રોમ)",
        "Hard Disk (હાર્ડ ડિસ્ક)",
        "DVD (ડીવીડી)"
    ], 
    answer: "RAM (રેમ)" 
},

{ 
    q: "Which component stores data permanently? (Data ને કાયમી રીતે Store કરવા માટે કયો Component વપરાય છે?)", 
    options: [
        "Hard Disk (હાર્ડ ડિસ્ક)",
        "RAM (રેમ)",
        "Cache Memory (કેશ મેમરી)",
        "Register (રજિસ્ટર)"
    ], 
    answer: "Hard Disk (હાર્ડ ડિસ્ક)" 
},

{ 
    q: "Which device is used to display visual output? (Visual Output દર્શાવવા માટે કયા Device નો ઉપયોગ થાય છે?)", 
    options: [
        "Monitor (મોનિટર)",
        "Keyboard (કીબોર્ડ)",
        "Mouse (માઉસ)",
        "Microphone (માઇક્રોફોન)"
    ], 
    answer: "Monitor (મોનિટર)" 
},

{ 
    q: "Which device is used to enter sound into a computer? (કમ્પ્યુટરમાં અવાજ દાખલ કરવા માટે કયા Device નો ઉપયોગ થાય છે?)", 
    options: [
        "Microphone (માઇક્રોફોન)",
        "Speaker (સ્પીકર)",
        "Monitor (મોનિટર)",
        "Printer (પ્રિન્ટર)"
    ], 
    answer: "Microphone (માઇક્રોફોન)" 
},

{ 
    q: "Which device is used to hear sound from a computer? (કમ્પ્યુટરમાંથી અવાજ સાંભળવા માટે કયા Device નો ઉપયોગ થાય છે?)", 
    options: [
        "Speaker (સ્પીકર)",
        "Microphone (માઇક્રોફોન)",
        "Scanner (સ્કેનર)",
        "Keyboard (કીબોર્ડ)"
    ], 
    answer: "Speaker (સ્પીકર)" 
},

{ 
    q: "Which device is used for video communication? (Video Communication માટે કયા Device નો ઉપયોગ થાય છે?)", 
    options: [
        "Webcam (વેબકેમ)",
        "Printer (પ્રિન્ટર)",
        "Scanner (સ્કેનર)",
        "Speaker (સ્પીકર)"
    ], 
    answer: "Webcam (વેબકેમ)" 
},

{ 
    q: "Which device converts a paper document into digital form? (Paper Document ને Digital Form માં બદલવા માટે કયા Device નો ઉપયોગ થાય છે?)", 
    options: [
        "Scanner (સ્કેનર)",
        "Printer (પ્રિન્ટર)",
        "Monitor (મોનિટર)",
        "Speaker (સ્પીકર)"
    ], 
    answer: "Scanner (સ્કેનર)" 
},

{ 
    q: "Which device converts digital documents into printed copies? (Digital Document ને Printed Copy માં બદલવા માટે કયા Device નો ઉપયોગ થાય છે?)", 
    options: [
        "Printer (પ્રિન્ટર)",
        "Scanner (સ્કેનર)",
        "Mouse (માઉસ)",
        "Keyboard (કીબોર્ડ)"
    ], 
    answer: "Printer (પ્રિન્ટર)" 
},

{ 
    q: "Which printer uses toner powder? (કયો Printer Toner Powder નો ઉપયોગ કરે છે?)", 
    options: [
        "Laser Printer (લેસર પ્રિન્ટર)",
        "Inkjet Printer (ઇંકજેટ પ્રિન્ટર)",
        "Dot Matrix Printer (ડોટ મેટ્રિક્સ પ્રિન્ટર)",
        "Thermal Printer (થર્મલ પ્રિન્ટર)"
    ], 
    answer: "Laser Printer (લેસર પ્રિન્ટર)" 
},

{ 
    q: "Which printer uses liquid ink? (કયો Printer Liquid Ink નો ઉપયોગ કરે છે?)", 
    options: [
        "Inkjet Printer (ઇંકજેટ પ્રિન્ટર)",
        "Laser Printer (લેસર પ્રિન્ટર)",
        "Dot Matrix Printer (ડોટ મેટ્રિક્સ પ્રિન્ટર)",
        "Plotter (પ્લોટર)"
    ], 
    answer: "Inkjet Printer (ઇંકજેટ પ્રિન્ટર)" 
},

{ 
    q: "Which printer uses pins and an ink ribbon? (કયો Printer Pins અને Ink Ribbon નો ઉપયોગ કરે છે?)", 
    options: [
        "Dot Matrix Printer (ડોટ મેટ્રિક્સ પ્રિન્ટર)",
        "Laser Printer (લેસર પ્રિન્ટર)",
        "Inkjet Printer (ઇંકજેટ પ્રિન્ટર)",
        "Thermal Printer (થર્મલ પ્રિન્ટર)"
    ], 
    answer: "Dot Matrix Printer (ડોટ મેટ્રિક્સ પ્રિન્ટર)" 
},

{ 
    q: "Which device is commonly used for large engineering drawings? (મોટા Engineering Drawings માટે સામાન્ય રીતે કયા Device નો ઉપયોગ થાય છે?)", 
    options: [
        "Plotter (પ્લોટર)",
        "Scanner (સ્કેનર)",
        "Keyboard (કીબોર્ડ)",
        "Mouse (માઉસ)"
    ], 
    answer: "Plotter (પ્લોટર)" 
},

{ 
    q: "Which device is used to read barcodes? (Barcode વાંચવા માટે કયા Device નો ઉપયોગ થાય છે?)", 
    options: [
        "Barcode Scanner (બારકોડ સ્કેનર)",
        "Monitor (મોનિટર)",
        "Printer (પ્રિન્ટર)",
        "Speaker (સ્પીકર)"
    ], 
    answer: "Barcode Scanner (બારકોડ સ્કેનર)" 
},

{ 
    q: "Which device is used to read QR codes? (QR Code વાંચવા માટે કયા Device નો ઉપયોગ થાય છે?)", 
    options: [
        "Camera (કેમેરા)",
        "Printer (પ્રિન્ટર)",
        "Keyboard (કીબોર્ડ)",
        "Speaker (સ્પીકર)"
    ], 
    answer: "Camera (કેમેરા)" 
},

{ 
    q: "Which component connects different hardware components inside a computer? (કમ્પ્યુટરની અંદરના અલગ અલગ Hardware Components ને જોડતું Component કયું છે?)", 
    options: [
        "Motherboard (મધરબોર્ડ)",
        "Monitor (મોનિટર)",
        "Keyboard (કીબોર્ડ)",
        "Printer (પ્રિન્ટર)"
    ], 
    answer: "Motherboard (મધરબોર્ડ)" 
},

{ 
    q: "What is the main circuit board of a computer called? (કમ્પ્યુટરનું મુખ્ય Circuit Board શું કહેવાય છે?)", 
    options: [
        "Motherboard (મધરબોર્ડ)",
        "Hard Disk (હાર્ડ ડિસ્ક)",
        "RAM (રેમ)",
        "CPU Fan (સીપીયુ ફેન)"
    ], 
    answer: "Motherboard (મધરબોર્ડ)" 
},

{ 
    q: "Which component supplies electrical power to a desktop computer? (Desktop Computer ને Electrical Power કયો Component આપે છે?)", 
    options: [
        "Power Supply Unit (પાવર સપ્લાય યુનિટ)",
        "RAM (રેમ)",
        "CPU (સીપીયુ)",
        "Motherboard (મધરબોર્ડ)"
    ], 
    answer: "Power Supply Unit (પાવર સપ્લાય યુનિટ)" 
},

{ 
    q: "What is the full form of PSU? (PSU નું સંપૂર્ણ નામ શું છે?)", 
    options: [
        "Power Supply Unit (પાવર સપ્લાય યુનિટ)",
        "Power System Unit (પાવર સિસ્ટમ યુનિટ)",
        "Processing Supply Unit (પ્રોસેસિંગ સપ્લાય યુનિટ)",
        "Primary System Utility (પ્રાઇમરી સિસ્ટમ યુટિલિટી)"
    ], 
    answer: "Power Supply Unit (પાવર સપ્લાય યુનિટ)" 
},

{ 
    q: "Which component helps cool the CPU? (CPU ને ઠંડુ રાખવામાં કયો Component મદદ કરે છે?)", 
    options: [
        "CPU Fan (સીપીયુ ફેન)",
        "Keyboard (કીબોર્ડ)",
        "RAM (રેમ)",
        "Speaker (સ્પીકર)"
    ], 
    answer: "CPU Fan (સીપીયુ ફેન)" 
},

{ 
    q: "Which memory is located close to or inside the CPU for fast access? (ઝડપી Access માટે CPU ની નજીક અથવા અંદર કઈ Memory હોય છે?)", 
    options: [
        "Cache Memory (કેશ મેમરી)",
        "Hard Disk (હાર્ડ ડિસ્ક)",
        "DVD (ડીવીડી)",
        "Pen Drive (પેન ડ્રાઇવ)"
    ], 
    answer: "Cache Memory (કેશ મેમરી)" 
},

{ 
    q: "Which memory is faster than RAM? (RAM કરતાં ઝડપી Memory કઈ છે?)", 
    options: [
        "Cache Memory (કેશ મેમરી)",
        "Hard Disk (હાર્ડ ડિસ્ક)",
        "CD (સીડી)",
        "Pen Drive (પેન ડ્રાઇવ)"
    ], 
    answer: "Cache Memory (કેશ મેમરી)" 
},

{ 
    q: "Which storage device is portable and commonly connected through USB? (Portable Storage Device જે સામાન્ય રીતે USB દ્વારા Connect થાય છે તે કયું છે?)", 
    options: [
        "Pen Drive (પેન ડ્રાઇવ)",
        "Monitor (મોનિટર)",
        "CPU (સીપીયુ)",
        "Motherboard (મધરબોર્ડ)"
    ], 
    answer: "Pen Drive (પેન ડ્રાઇવ)"

        function removeDuplicateQuestions(arr) {
            const seen = new Set();

            return arr.filter(q => {
                const key = q.q.trim().toLowerCase();

                if (seen.has(key)) {
                    return false;
                }

                seen.add(key);
                return true;
            });
        }

        let questions = removeDuplicateQuestions(allQuestions);
        let currentQuestion = 0;
        let score = 0;
        let timer = 30;
        let timerInterval;
        let studentName = "";
        let reviewData = [];

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startExam() {

            studentName =
                document.getElementById("studentName").value.trim();

            if (studentName === "") {
                alert("Please enter student name");
                return;
            }

            document.getElementById("studentSection").style.display = "none";
            document.getElementById("quizSection").style.display = "block";

            shuffleArray(questions);
            questions = shuffleArray(
                removeDuplicateQuestions(allQuestions)
            ).slice(0, 10);

            loadQuestion();
        }

        function loadQuestion() {

            if (currentQuestion >= questions.length) {
                finishExam();
                return;
            }

            let q = questions[currentQuestion];

            document.getElementById("progressText").innerHTML =
                `Question ${currentQuestion + 1} of ${questions.length}`;

            document.getElementById("progressBar").style.width =
                ((currentQuestion / questions.length) * 100) + "%";

            document.getElementById("question").innerHTML = q.q;

            let options = [...q.options];
            shuffleArray(options);

            let html = "";

            options.forEach(option => {

                html += `
        <button class="option"
        onclick="checkAnswer('${option}')">
        ${option}
        </button>
        `;

            });

            document.getElementById("options").innerHTML = html;

            startTimer();
        }

        function startTimer() {

            clearInterval(timerInterval);

            timer = 30;

            document.getElementById("timer").innerHTML =
                `⏳ ${timer}`;

            timerInterval = setInterval(() => {

                timer--;

                document.getElementById("timer").innerHTML =
                    `⏳ ${timer}`;

                if (timer <= 0) {

                    clearInterval(timerInterval);

                    let q = questions[currentQuestion];

                    reviewData.push({
                        question: q.q,
                        selected: "No Answer",
                        correct: q.answer
                    });

                    currentQuestion++;

                    loadQuestion();
                }

            }, 1000);
        }

        function checkAnswer(selected) {

            clearInterval(timerInterval);

            let q = questions[currentQuestion];

            let buttons =
                document.querySelectorAll(".option");

            buttons.forEach(btn => {

                btn.disabled = true;

                if (btn.innerText === q.answer) {
                    btn.classList.add("correct");
                }

                if (
                    btn.innerText === selected &&
                    selected !== q.answer
                ) {
                    btn.classList.add("wrong");
                }

            });

            reviewData.push({
                question: q.q,
                selected: selected,
                correct: q.answer
            });

            if (selected === q.answer) {

                score++;

                let sound =
                    document.getElementById("correctSound");

                if (sound) sound.play();

            } else {

                let sound =
                    document.getElementById("wrongSound");

                if (sound) sound.play();

            }

            document.getElementById("scoreBoard").innerHTML =
                `Score: ${score}`;

            currentQuestion++;

            setTimeout(loadQuestion, 1200);
        }

        function finishExam() {

            document.getElementById("quizSection").style.display = "none";

            document.getElementById("certificate").style.display = "block";

            let percentage =
                Math.round((score / questions.length) * 100);

            document.getElementById("certName").innerHTML =
                studentName;

            document.getElementById("certPercent").innerHTML =
                `Percentage : ${percentage}%`;

            document.getElementById("certStatus").innerHTML =
                percentage >= 40 ? "✅ PASS" : "❌ FAIL";

            if (cheatCount >= 3) {
                document.getElementById("certStatus").innerHTML =
                    "❌ FAILED (CHEATING DETECTED)";
            }

            let grade = "";

            if (percentage >= 90) {
                grade = "🥇 GOLD";
            }
            else if (percentage >= 70) {
                grade = "🥈 SILVER";
            }
            else if (percentage >= 50) {
                grade = "🥉 BRONZE";
            }
            else {
                grade = "📚 PARTICIPATION";
            }

            document.getElementById("certGrade").innerHTML =
                `Grade : ${grade}`;

            document.getElementById("certDate").innerHTML =
                new Date().toLocaleDateString();

            let certGrade = "";

            if (percentage >= 90) {
                certGrade = "A+";
            }
            else if (percentage >= 70) {
                certGrade = "A";
            }
            else if (percentage >= 50) {
                certGrade = "B";
            }
            else {
                certGrade = "C";
            }

            let user = JSON.parse(
                localStorage.getItem("currentStudent")
            );

            let students = JSON.parse(
                localStorage.getItem("students")
            );

            if (!user.examResults) {
                user.examResults = [];
            }

            user.examResults.push({
                userName: user.name,
                score: score,
                total: questions.length,
                percentage: percentage,
                grade: certGrade,
                date: new Date().toLocaleString()
            });

            user.examScore = score;
            user.percentage = percentage;
            user.grade = certGrade;

            students = students.map(s => {

                if (s.id === user.id) {

                    s.examResults = user.examResults;
                    s.examScore = score;
                    s.percentage = percentage;
                    s.grade = certGrade;
                }

                return s;
            });

            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );

            localStorage.setItem(
                "currentStudent",
                JSON.stringify(user)
            );

            let tbody =
                document.querySelector("#reviewTable tbody");

            let html = "";

            reviewData.forEach((r, index) => {

                html += `
<tr style="${r.selected !== r.correct
                        ? 'background:#ffe5e5;'
                        : 'background:#e8ffe8;'
                    }">
<td>${index + 1}</td>
<td>${r.question}</td>
<td style="color:${r.selected !== r.correct ? 'red' : 'green'
                    };font-weight:bold;">
${r.selected}
</td>
<td style="color:green;font-weight:bold;">
${r.correct}
</td>
</tr>
`;

            });

            tbody.innerHTML = html;

            document.getElementById("reviewSection").style.display =
                "block";

        }


        document.addEventListener("contextmenu", e => {
            e.preventDefault();
        });



        document.addEventListener("copy", e => {
            e.preventDefault();
            alert("⚠ Copying is not allowed.");
        });

        document.addEventListener("selectstart", e => {
            e.preventDefault();
        });

        





        document.addEventListener("click", function (e) {

            if (e.target.id === "downloadQA") {


                let content = "EXAM REPORT\n\n";

                content += "========================\n";
                content += "✅ CORRECT ANSWERS\n";
                content += "========================\n\n";

                reviewData.forEach((r, index) => {

                    if (r.selected === r.correct) {

                        content += (index + 1) + ". " + r.question + "\n";
                        content += "Your Answer: " + r.selected + "\n";
                        content += "Correct Answer: " + r.correct + "\n";
                        content += "-------------------------\n\n";

                    }

                });

                content += "\n\n========================\n";
                content += "❌ WRONG ANSWERS\n";
                content += "========================\n\n";

                reviewData.forEach((r, index) => {

                    if (r.selected !== r.correct) {

                        content += (index + 1) + ". " + r.question + "\n";
                        content += "Your Answer: " + r.selected + "\n";
                        content += "Correct Answer: " + r.correct + "\n";
                        content += "-------------------------\n\n";

                    }

                });

                const blob = new Blob([content], {
                    type: "text/plain"
                });

                const a = document.createElement("a");

                a.href = URL.createObjectURL(blob);

                a.download = "Exam_Report.txt";

                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);


            }


        });
