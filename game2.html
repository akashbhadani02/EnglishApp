<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦜 Talking Parrot Pro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(to top,#87CEEB,#dff8ff);
}

/* Sky */
.sky{
position:fixed;
width:100%;
height:100%;
left:0;
top:0;
overflow:hidden;
z-index:0;
}

/* Clouds */
.cloud{
position:absolute;
font-size:70px;
opacity:.8;
animation:cloudMove linear infinite;
}

.cloud:nth-child(1){
top:10%;
left:-200px;
animation-duration:40s;
}

.cloud:nth-child(2){
top:30%;
left:-300px;
animation-duration:55s;
}

.cloud:nth-child(3){
top:60%;
left:-250px;
animation-duration:48s;
}

@keyframes cloudMove{
0%{
transform:translateX(0);
}
100%{
transform:translateX(calc(100vw + 500px));
}
}

/* Flying Parrot */
.parrot{
position:fixed;
left:-150px;
top:20%;
font-size:90px;
z-index:100;
pointer-events:none;
animation:
fly 16s linear infinite,
flap .35s ease-in-out infinite alternate,
floatBird 2s ease-in-out infinite;
}

@keyframes fly{

0%{
left:-150px;
top:18%;
transform:scaleX(1);
}

20%{
top:8%;
}

40%{
top:30%;
}

49%{
left:105%;
transform:scaleX(1);
}

50%{
left:105%;
transform:scaleX(-1);
}

70%{
top:15%;
}

90%{
top:35%;
}

100%{
left:-150px;
top:18%;
transform:scaleX(-1);
}

}

@keyframes flap{
from{
rotate:-8deg;
}
to{
rotate:8deg;
}
}

@keyframes floatBird{
0%{margin-top:0;}
50%{margin-top:-12px;}
100%{margin-top:0;}
}

/* Game Box */

.game{

position:relative;
z-index:10;

width:520px;
max-width:95%;

background:white;

padding:25px;

border-radius:25px;

box-shadow:0 20px 40px rgba(0,0,0,.3);

text-align:center;

}

h1{

color:#2c3e50;
margin-bottom:10px;

}

.info{

font-size:18px;
margin-bottom:15px;

}

#sentence{

min-height:70px;

font-size:26px;

font-weight:bold;

color:#1976d2;

display:flex;

justify-content:center;

align-items:center;

padding:15px;

border-radius:12px;

background:#eef8ff;

margin-bottom:20px;

}

.buttons{

display:flex;

justify-content:center;

gap:10px;

flex-wrap:wrap;

}

button{

padding:14px 24px;

font-size:18px;

border:none;

border-radius:12px;

cursor:pointer;

transition:.3s;

color:white;

}

.next{

background:#27ae60;

}

.next:hover{

background:#219150;

}

.repeat{

background:#e67e22;

}

.repeat:hover{

background:#cf6f18;

}

#mic{

display:none;

font-size:32px;

margin-top:20px;

animation:blink .6s infinite;

}

@keyframes blink{

50%{

opacity:.2;

}

}

#result{

margin-top:20px;

font-size:22px;

min-height:60px;

}

.score{

margin-top:15px;

font-size:18px;

font-weight:bold;

color:#555;

}

/* Mobile */

@media(max-width:600px){

.parrot{

font-size:70px;

}

#sentence{

font-size:21px;

}

button{

width:100%;

}

.buttons{

display:block;

}

.buttons button{

margin-top:10px;

}

}
</style>
</head>

<body>

<div class="sky">

<div class="cloud">☁️</div>
<div class="cloud">☁️</div>
<div class="cloud">☁️</div>

</div>

<div class="parrot">
🦜
</div>

<div class="game">

<h1>🦜 Talking Parrot Pro</h1>

<div class="info">
Press <b>Next Sentence</b><br>
Listen Carefully & Repeat
</div>

<div id="sentence">
Loading...
</div>

<div class="buttons">

<button class="next" onclick="nextSentence()">
🔊 Next Sentence
</button>

<button class="repeat" onclick="startSpeech()">
🎤 Repeat
</button>

</div>

<div id="mic">
🎙️ Listening...
</div>

<div id="result"></div>

<div class="score">
Sentence:
<span id="count">1</span>
/
<span id="total">30</span>
</div>

<script>
    const sentences = [
"Every small step brings me closer to my goals",
"I believe every challenge is an opportunity to grow",
"Learning English has changed the way I communicate",
"Consistency is more important than perfection",
"I enjoy exploring new ideas and solving problems",
"I always try to stay positive in difficult situations",
"Confidence comes from regular practice",
"I am improving my communication skills every day",
"Success requires patience and determination",
"I prefer spending my free time reading books",
"I like meeting people from different cultures",
"I believe honesty is the foundation of every relationship",
"Technology has made our lives more convenient",
"I enjoy learning something new every single day",
"Hard work always pays off in the long run",
"I never stop trying until I achieve my goal",
"I can adapt to new environments very quickly",
"I believe that time is our most valuable resource",
"I enjoy helping others whenever I can",
"I stay calm even under pressure",
"My dream is to become financially independent",
"I focus on improving myself instead of comparing with others",
"I like taking responsibility for my actions",
"I always look for solutions instead of excuses",
"Every experience teaches us an important lesson",
"Communication is the key to success",
"I enjoy working with creative people",
"I am becoming more confident in speaking English",
"I believe that knowledge is true power",
"I always give my best in everything I do"
];

let index = 0;

document.getElementById("total").innerText = sentences.length;

function speak(text){

speechSynthesis.cancel();

const speech = new SpeechSynthesisUtterance(text);

speech.lang = "en-US";
speech.rate = 0.9;
speech.pitch = 1;
speech.volume = 1;

speechSynthesis.speak(speech);

}

function nextSentence(){

document.getElementById("result").innerHTML = "";

document.getElementById("sentence").innerHTML =
sentences[index];

document.getElementById("count").innerHTML =
index+1;

speak(sentences[index]);

}

function normalize(str){

return str
.toLowerCase()
.replace(/[.,!?]/g,"")
.replace(/\s+/g," ")
.trim();

}

function startSpeech(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert("Please use Google Chrome");

return;

}

const recognition = new SpeechRecognition();

recognition.lang = "en-US";
recognition.continuous = false;
recognition.interimResults = false;
recognition.maxAlternatives = 1;

document.getElementById("mic").style.display = "block";

recognition.start();

recognition.onresult = function(e){

document.getElementById("mic").style.display = "none";

const spoken =
e.results[0][0].transcript;

document.getElementById("result").innerHTML =
"<b>You Said:</b><br>"+spoken;

if(
normalize(spoken) ===
normalize(sentences[index])
){

document.getElementById("result").innerHTML +=
"<br><br>✅ Excellent!";

index++;

if(index >= sentences.length){

setTimeout(()=>{

alert("🎉 Congratulations!\nYou completed all sentences.");

index = 0;

nextSentence();

},700);

}else{

setTimeout(()=>{

nextSentence();

},700);

}

}else{

document.getElementById("result").innerHTML +=
"<br><br>❌ Try Again";

setTimeout(()=>{

speak(sentences[index]);

},1000);

}

};

recognition.onerror = function(){

document.getElementById("mic").style.display = "none";

alert("🎤 Microphone Error");

};

recognition.onend = function(){

document.getElementById("mic").style.display = "none";

};

}

window.onload = function(){

nextSentence();

};
</script>

</body>
</html>
