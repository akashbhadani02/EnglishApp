<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FPS CLEAN IMPROVED GAME</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:linear-gradient(135deg,#ff9a9e,#a18cd1,#fad0c4);
touch-action:none;
cursor:crosshair;
}

#ui{
position:absolute;
top:10px;
left:10px;
background:rgba(0,0,0,0.6);
color:white;
padding:12px;
border-radius:12px;
width:260px;
z-index:2;
}

#crosshair{
position:absolute;
top:50%;
left:50%;
width:12px;
height:12px;
margin-left:-6px;
margin-top:-6px;
border:2px solid #00ffcc;
border-radius:50%;
z-index:999;
}

button{
width:100%;
padding:8px;
margin-top:6px;
border:none;
border-radius:8px;
background:linear-gradient(90deg,#ff00cc,#3333ff,#00ffcc);
color:white;
font-weight:bold;
}

#joystick{
position:absolute;
bottom:20px;
left:20px;
width:120px;
height:120px;
border-radius:50%;
border:2px solid #00ffcc;
background:rgba(255,255,255,0.1);
}

#stick{
position:absolute;
width:50px;
height:50px;
background:#00ffcc;
border-radius:50%;
top:35px;
left:35px;
}
</style>
</head>

<body>

<div id="ui">
🎮 Score: <span id="score">0</span><br>
⏱ Time: <span id="time">500</span><br>
🎯 Find: <span id="word">-</span><br>

<button onclick="startGame()">START</button>
<button onclick="toggleMode()">MODE</button>
</div>

<div id="crosshair"></div>

<div id="joystick">
<div id="stick"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// ================= SETUP =================
let scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

let camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,2,5);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1.5));

// ================= DATA =================
let items=[
{word:"FIRE", emoji:"🔥"},
{word:"BALL", emoji:"⚽"},
{word:"RAIN", emoji:"🌧️"},
{word:"TREE", emoji:"🌳"},
{word:"FISH", emoji:"🐟"},
{word:"BIRD", emoji:"🐦"},
{word:"MOON", emoji:"🌙"},
{word:"STAR", emoji:"⭐"},
{word:"WIND", emoji:"💨"},
{word:"SNOW", emoji:"❄️"},
{word:"LAKE", emoji:"🏞️"},
{word:"SHIP", emoji:"🚢"},
{word:"BEAR", emoji:"🐻"},
{word:"WOLF", emoji:"🐺"},
{word:"FROG", emoji:"🐸"},
{word:"DEER", emoji:"🦌"},
{word:"DUCK", emoji:"🦆"},
{word:"PIGS", emoji:"🐷"},
{word:"COW", emoji:"🐮"},
{word:"LAMB", emoji:"🐑"},
{word:"CAKE", emoji:"🍰"},
{word:"MILK", emoji:"🥛"},
{word:"RICE", emoji:"🍚"},
{word:"SALT", emoji:"🧂"},
{word:"TEA", emoji:"🍵"},
{word:"JUCE", emoji:"🧃"},
{word:"BOOK", emoji:"📘"},
{word:"GAME", emoji:"🎮"},
{word:"GIFT", emoji:"🎁"},
{word:"CASH", emoji:"💰"},
{word:"GOLD", emoji:"🥇"},
{word:"FARM", emoji:"🚜"},
{word:"HOME", emoji:"🏠"},
{word:"DOOR", emoji:"🚪"},
{word:"ROAD", emoji:"🛣️"},
{word:"CITY", emoji:"🏙️"},
{word:"PARK", emoji:"🌳"},
{word:"SAND", emoji:"🏖️"},
{word:"WAVE", emoji:"🌊"},
{word:"CUBE", emoji:"🧊"}
];

let objects=[];
let target={answer:""};

let score=0;
let time=500;
let running=false;
let mode="wordToEmoji";
let combo=0;

let keys={};

// ================= UI =================
let scoreEl=document.getElementById("score");
let timeEl=document.getElementById("time");
let wordEl=document.getElementById("word");

// ================= MODE =================
function toggleMode(){
mode = (mode==="wordToEmoji") ? "emojiToWord" : "wordToEmoji";
newRound();
}

// ================= OBJECTS =================
function createObjects(){

objects.forEach(o=>scene.remove(o));
objects=[];

let gridSize=3;

for(let i=0;i<items.length;i++){

let item = items[i];

let canvas=document.createElement("canvas");
canvas.width=256;
canvas.height=256;
let ctx=canvas.getContext("2d");

// background
ctx.fillStyle="#111";
ctx.fillRect(0,0,256,256);

let display = (mode==="wordToEmoji") ? item.emoji : item.word;

// 🔥 AUTO SIZE FIX
let size = display.length > 6 ? 55 : 85;

// emoji extra big
if(/[\u{1F300}-\u{1FAFF}]/u.test(display)){
size = 95;
}

ctx.font = "bold " + size + "px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";

// glow effect
ctx.fillStyle="white";
ctx.shadowColor="black";
ctx.shadowBlur=18;

ctx.fillText(display,128,128);

let tex=new THREE.CanvasTexture(canvas);
let mat=new THREE.MeshBasicMaterial({map:tex});

let cube=new THREE.Mesh(new THREE.BoxGeometry(),mat);

cube.position.set(
(i%gridSize-1)*4,
Math.random()*2+1,
(Math.floor(i/gridSize)-1)*4
);

cube.userData={
...item,
vx:(Math.random()-0.5)*0.05,
vz:(Math.random()-0.5)*0.05
};

scene.add(cube);
objects.push(cube);
}
}

// ================= GAME =================
function startGame(){

score=0;
time=500;
combo=0;
running=true;

newRound();

setInterval(()=>{
if(!running) return;
time--;
if(time<=0) running=false;
updateUI();
},1000);
}

function newRound(){

let item = items[Math.floor(Math.random()*items.length)];

if(mode==="wordToEmoji"){
target.answer = item.emoji;
wordEl.innerText = item.word;
}else{
target.answer = item.word;
wordEl.innerText = item.emoji;
}

createObjects();
}

function updateUI(){
scoreEl.innerText=score;
timeEl.innerText=time;
}

// ================= SHOOT =================
function shoot(e){

if(!running) return;

let x = e.clientX || (e.touches && e.touches[0].clientX);
let y = e.clientY || (e.touches && e.touches[0].clientY);

let mouse = new THREE.Vector2(
(x/innerWidth)*2-1,
-(y/innerHeight)*2+1
);

let raycaster = new THREE.Raycaster();
raycaster.setFromCamera(mouse,camera);

let hits = raycaster.intersectObjects(objects);

if(hits.length>0){

let obj = hits[0].object;

let correct =
(mode==="wordToEmoji")
? obj.userData.emoji === target.answer
: obj.userData.word === target.answer;

if(correct){
combo++;
score += 10 * combo;
obj.scale.set(1.5,1.5,1.5);
setTimeout(()=>obj.scale.set(1,1,1),120);
}else{
combo=0;
score -= 5;
camera.position.x += (Math.random()-0.5)*0.3;
camera.position.y += (Math.random()-0.5)*0.3;
}

scene.remove(obj);
newRound();
updateUI();
}
}

document.addEventListener("mousedown",shoot);
document.addEventListener("touchstart",shoot,{passive:false});

// ================= MOVEMENT =================
let move={x:0,z:0};

document.addEventListener("keydown",(e)=>{
let k=e.key.toLowerCase();
if(k==="w") move.z=-1;
if(k==="s") move.z=1;
if(k==="a") move.x=-1;
if(k==="d") move.x=1;
});

document.addEventListener("keyup",()=>move={x:0,z:0});

// ================= JOYSTICK =================
let moveX=0,moveZ=0;

let joy=document.getElementById("joystick");
let stick=document.getElementById("stick");

joy.addEventListener("touchmove",(e)=>{
let t=e.touches[0];
let r=joy.getBoundingClientRect();

let x=t.clientX-r.left-60;
let y=t.clientY-r.top-60;

x=Math.max(-40,Math.min(40,x));
y=Math.max(-40,Math.min(40,y));

moveX=x/40;
moveZ=y/40;

stick.style.left=(60+x-25)+"px";
stick.style.top=(60+y-25)+"px";
});

joy.addEventListener("touchend",()=>{
moveX=0;
moveZ=0;
stick.style.left="35px";
stick.style.top="35px";
});

// ================= LOOK =================
let yaw=0,pitch=0;

document.addEventListener("mousemove",(e)=>{
yaw -= e.movementX*0.002;
pitch -= e.movementY*0.002;
});

// ================= LOOP =================
function animate(){
requestAnimationFrame(animate);

camera.rotation.set(pitch,yaw,0);

camera.position.x += move.x*0.08 + moveX*0.08;
camera.position.z += move.z*0.08 + moveZ*0.08;

objects.forEach(o=>{
o.rotation.y += 0.03;

o.position.x += o.userData.vx;
o.position.z += o.userData.vz;

if(o.position.x>10||o.position.x<-10) o.userData.vx*=-1;
if(o.position.z>10||o.position.z<-10) o.userData.vz*=-1;
});

renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
