<!doctype html>
<html lang="gu">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Spoken English Quest Pro</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui;
            background: linear-gradient(135deg, #0f172a, #4338ca);
            color: #fff;
            padding: 15px;
            min-height: 100vh
        }

        .wrap {
            max-width: 500px;
            margin: auto;
            width: 100%
        }

        .card {
            background: rgba(255, 255, 255, .1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .big {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fbbf24
        }

        /* Responsive Buttons */
        button {
            background: #22c55e;
            border: 0;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 8px;
            transition: 0.3s
        }

        button:active {
            transform: scale(0.95)
        }

        /* Responsive Wheel */
        #wheel {
            width: 100px;
            height: 100px;
            border: 6px solid #fbbf24;
            border-radius: 50%;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 3s;
            font-weight: bold;
            background: conic-gradient(#ef4444 0deg 90deg, #f59e0b 90deg 180deg, #3b82f6 180deg 270deg, #10b981 270deg 360deg);
        }

        /* મોબાઈલ માટે ખાસ એડજસ્ટમેન્ટ */
        @media (max-width: 400px) {
            .big {
                font-size: 1.2rem;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>💰 Spoken English Quest</h1>
        <div class="grid">
            <div class="card">
                <div>Wallet</div>
                <div class="big">₹<span id="w">0</span></div>
            </div>
            <div class="card">
                <div>Coins</div>
                <div class="big"><span id="c">0</span></div>
            </div>
        </div>

        <div class="card">
            <h2 id="qText" style="font-size: 1.2rem;">પ્રશ્ન લોડ થઈ રહ્યો છે...</h2>
            <div id="opts"></div>
        </div>

        <div class="card">
            <h2>Bonus Zone</h2>
            <div id="wheel">SPIN</div>
            <button onclick="spin()" id="spinBtn">Lucky Spin</button>
            <button onclick="dailyReward()" style="background:#8b5cf6">Daily Reward</button>
        </div>
    </div>

    <script>
        let d = JSON.parse(localStorage.walletEnglish || '{"coins":0,"wallet":0,"lastSpin":"","lastLogin":""}');
        let { coins, wallet, lastSpin, lastLogin } = d;
        let currentQ = 0;

        const quiz = [
            { q: "Apple નો અર્થ?", a: ["સફરજન", "કેળું", "દ્રાક્ષ", "કેરી"], ans: "સફરજન" },
            { q: "Water એટલે?", a: ["દૂધ", "પાણી", "ચા", "કોફી"], ans: "પાણી" },
            { q: "School નો અર્થ?", a: ["શાળા", "ઘર", "ઓફિસ", "બગીચો"], ans: "શાળા" },
            { q: "Friend એટલે?", a: ["દુશ્મન", "મિત્ર", "ભાઈ", "પડોશી"], ans: "મિત્ર" },
            { q: "Sun નો અર્થ?", a: ["ચંદ્ર", "સૂર્ય", "તારા", "આકાશ"], ans: "સૂર્ય" },
            {q: "‘Resilience’ નો અર્થ શું થાય?", a: ["પરિવર્તન", "સ્થિતિસ્થાપકતા/દ્રઢતા", "નબળાઈ", "સપનું"], ans: "સ્થિતિસ્થાપકતા/દ્રઢતા"},
    {q: "‘Eloquent’ એટલે શું?", a: ["શાંત", "સ્પષ્ટવક્તા/પ્રભાવશાળી", "અસ્પષ્ટ", "ક્રોધિત"], ans: "સ્પષ્ટવક્તા/પ્રભાવશાળી"},
    {q: "‘Ambiguous’ નો સાચો અર્થ?", a: ["સ્પષ્ટ", "અસ્પષ્ટ/દ્વિઅર્થી", "સીધું", "ખોટું"], ans: "અસ્પષ્ટ/દ્વિઅર્થી"},
    {q: "‘Benevolent’ એટલે શું?", a: ["સ્વાર્થી", "પરોપકારી/દયાળુ", "ક્રૂર", "કંજૂસ"], ans: "પરોપકારી/દયાળુ"},
    {q: "‘Meticulous’ નો અર્થ?", a: ["બેદરકાર", "ઝીણવટભર્યું/ચોકસાઈભર્યું", "ઝડપી", "ધીમું"], ans: "ઝીણવટભર્યું/ચોકસાઈભર્યું"},
    {q: "‘Scrutinize’ એટલે શું?", a: ["જોવું", "ઝીણવટપૂર્વક તપાસવું", "અવગણવું", "ભૂલી જવું"], ans: "ઝીણવટપૂર્વક તપાસવું"},
    {q: "‘Innocuous’ નો સાચો અર્થ?", a: ["હાનિકારક", "નિર્દોષ/નુકસાનરહિત", "મોટું", "અઘરું"], ans: "નિર્દોષ/નુકસાનરહિત"},
    {q: "‘Ephemeral’ એટલે શું?", a: ["શાશ્વત", "ક્ષણભંગુર/ટૂંકા ગાળાનું", "લાંબુ", "સ્થિર"], ans: "ક્ષણભંગુર/ટૂંકા ગાળાનું"},
    {q: "‘Pragmatic’ નો અર્થ?", a: ["વ્યવહારુ", "કાલ્પનિક", "ભાવુક", "અવિચારી"], ans: "વ્યવહારુ"},
    {q: "‘Superfluous’ એટલે શું?", a: ["જરૂરી", "જરૂર કરતાં વધારે", "અલ્પ", "મહત્વનું"], ans: "જરૂર કરતાં વધારે"},
    {q: "‘Obsolete’ નો અર્થ શું થાય?", a: ["નવું", "અપ્રચલિત/જૂના જમાનાનું", "ઝડપી", "કિંમતી"], ans: "અપ્રચલિત/જૂના જમાનાનું"},
    {q: "‘Exaggerate’ એટલે શું?", a: ["ઘટાડવું", "વાત વધારીને કહેવી/અતિશયોક્તિ", "શાંત રહેવું", "ખોટું બોલવું"], ans: "વાત વધારીને કહેવી/અતિશયોક્તિ"},
    {q: "‘Vulnerable’ નો સાચો અર્થ?", a: ["મજબૂત", "અસુરક્ષિત/નાજુક", "સુરક્ષિત", "હોશિયાર"], ans: "અસુરક્ષિત/નાજુક"},
    {q: "‘Adversity’ એટલે શું?", a: ["સફળતા", "આપત્તિ/મુશ્કેલીની સ્થિતિ", "ખુશી", "મિત્રતા"], ans: "આપત્તિ/મુશ્કેલીની સ્થિતિ"},
    {q: "‘Simultaneous’ નો અર્થ?", a: ["એક પછી એક", "એકસાથે/સમકાલીન", "ક્યારેક જ", "ધીમેથી"], ans: "એકસાથે/સમકાલીન"},
    {q: "‘Inevitably’ એટલે શું?", a: ["અનિવાર્યપણે/જેને રોકી ન શકાય", "કદાચ", "ક્યારેય નહીં", "ભૂલથી"], ans: "અનિવાર્યપણે/જેને રોકી ન શકાય"},
    {q: "‘Procrastinate’ નો સાચો અર્થ?", a: ["ઝડપથી કામ કરવું", "કામ પાછું ઠેલવું/આળસ કરવી", "મદદ કરવી", "આયોજન કરવું"], ans: "કામ પાછું ઠેલવું/આળસ કરવી"},
    {q: "‘Spontaneous’ એટલે શું?", a: ["વિચારીને કરેલું", "સ્વયંસ્ફુરિત/તરત જ થતું", "ધીમું", "કંટાળાજનક"], ans: "સ્વયંસ્ફુરિત/તરત જ થતું"},
    {q: "‘Compassion’ નો અર્થ?", a: ["ગુસ્સો", "કરુણા/દયા", "લાલચ", "ઈર્ષ્યા"], ans: "કરુણા/દયા"},
    {q: "‘Ambitious’ એટલે શું?", a: ["આળસુ", "મહત્વાકાંક્ષી", "ગરીબ", "સંતોષી"], ans: "મહત્વાકાંક્ષી"},
    {q: "‘Superficial’ નો સાચો અર્થ?", a: ["ઊંડું", "ઉપરછલ્લું/બાહ્ય", "મહત્વનું", "સાચું"], ans: "ઉપરછલ્લું/બાહ્ય"},
    {q: "‘Mitigate’ નો અર્થ?", a: ["વધારવું", "ઘટાડવું/હળવું કરવું", "નાશ કરવો", "બનાવવું"], ans: "ઘટાડવું/હળવું કરવું"},
    {q: "‘Cognitive’ એટલે શું?", a: ["શારીરિક", "જ્ઞાનાત્મક/બૌદ્ધિક", "સામાજિક", "ધાર્મિક"], ans: "જ્ઞાનાત્મક/બૌદ્ધિક"},
    {q: "‘Perseverance’ નો સાચો અર્થ?", a: ["મક્કમતા/સતત પ્રયત્ન", "હાર માની લેવી", "આરામ", "દોડવું"], ans: "મક્કમતા/સતત પ્રયત્ન"},
    {q: "‘Authentic’ નો અર્થ?", a: ["નકલી", "અસલી/પ્રમાણભૂત", "જૂનું", "નવું"], ans: "અસલી/પ્રમાણભૂત"},
    // --- ૧૦૦ સરળ પ્રશ્નો (નમૂનારૂપ) ---
    {q: "Big નો અર્થ?", a: ["નાનું", "મોટું", "લાંબુ", "ટુંકું"], ans: "મોટું"},
    {q: "Cold નો અર્થ?", a: ["ગરમ", "ઠંડું", "મીઠું", "તીખું"], ans: "ઠંડું"},
    {q: "Open નો અર્થ?", a: ["બંધ", "ખુલ્લું", "અંદર", "બહાર"], ans: "ખુલ્લું"},
    {q: "Night નો અર્થ?", a: ["સવાર", "સાંજ", "રાત", "બપોર"], ans: "રાત"},
    {q: "Up નો અર્થ?", a: ["નીચે", "ઉપર", "પાસે", "દૂર"], ans: "ઉપર"},
    {q: "Slow નો અર્થ?", a: ["ઝડપી", "ધીમું", "નવું", "જૂનું"], ans: "ધીમું"},
    {q: "Fat નો અર્થ?", a: ["પાતળું", "જાડું", "ઊંચું", "નીચું"], ans: "જાડું"},
    {q: "Sweet નો અર્થ?", a: ["કડવું", "મીઠું", "ખાટું", "ખારું"], ans: "મીઠું"},
    {q: "Work નો અર્થ?", a: ["રમત", "કામ", "ઊંઘ", "આરામ"], ans: "કામ"},
    {q: "Sad નો અર્થ?", a: ["ખુશ", "દુઃખી", "ગુસ્સો", "શાંત"], ans: "દુઃખી"},
    // (અહીં તમે આવા બીજા ૯૦ સરળ શબ્દો ઉમેરી શકો છો...)

    // --- ૧૦૦ મધ્યમ પ્રશ્નો ---
    {q: "Correct નો અર્થ?", a: ["ભૂલ", "સાચું", "નવું", "જૂનું"], ans: "સાચું"},
    {q: "Start નો અર્થ?", a: ["પૂરું", "શરૂ", "બંધ", "ચાલુ"], ans: "શરૂ"},
    {q: "Listen નો અર્થ?", a: ["બોલવું", "સાંભળવું", "લખવું", "વાંચવું"], ans: "સાંભળવું"},
    {q: "Helpful નો અર્થ?", a: ["મદદરૂપ", "સ્વાર્થી", "આળસુ", "ક્રૂર"], ans: "મદદરૂપ"},
    {q: "Journey નો અર્થ?", a: ["ઘર", "પ્રવાસ", "રસ્તો", "શાળા"], ans: "પ્રવાસ"},
    {q: "Simple નો અર્થ?", a: ["અઘરું", "સરળ", "મોટું", "નાનું"], ans: "સરળ"},
    {q: "Often નો અર્થ?", a: ["ક્યારેય", "હંમેશા", "ઘણીવાર", "ક્યારેક"], ans: "ઘણીવાર"},
    {q: "Healthy નો અર્થ?", a: ["બીમાર", "સ્વસ્થ", "નબળું", "થાકેલું"], ans: "સ્વસ્થ"},
    {q: "Expensive નો અર્થ?", a: ["સસ્તું", "મોંઘું", "જૂનું", "નવું"], ans: "મોંઘું"},
    {q: "Quiet નો અર્થ?", a: ["શાંત", "ઘોંઘાટ", "ઝડપી", "ધીમું"], ans: "શાંત"},
    // (અહીં તમે આવા બીજા ૯૦ મધ્યમ શબ્દો ઉમેરી શકો છો...)

    // --- ૧૦૦ અઘરા પ્રશ્નો ---
    {q: "Resilience નો અર્થ?", a: ["નબળાઈ", "દ્રઢતા", "પરિવર્તન", "સપનું"], ans: "દ્રઢતા"},
    {q: "Eloquent નો અર્થ?", a: ["શાંત", "પ્રભાવશાળી", "અસ્પષ્ટ", "ક્રોધિત"], ans: "પ્રભાવશાળી"},
    {q: "Ambiguous નો અર્થ?", a: ["સ્પષ્ટ", "અસ્પષ્ટ", "સીધું", "ખોટું"], ans: "અસ્પષ્ટ"},
    {q: "Benevolent નો અર્થ?", a: ["સ્વાર્થી", "પરોપકારી", "ક્રૂર", "કંજૂસ"], ans: "પરોપકારી"},
    {q: "Meticulous નો અર્થ?", a: ["બેદરકાર", "ચોકસાઈ", "ઝડપી", "ધીમું"], ans: "ચોકસાઈ"},
    {q: "Scrutinize નો અર્થ?", a: ["જોવું", "તપાસવું", "અવગણવું", "ભૂલવું"], ans: "તપાસવું"},
    {q: "Innocuous નો અર્થ?", a: ["હાનિકારક", "નિર્દોષ", "મોટું", "અઘરું"], ans: "નિર્દોષ"},
    {q: "Ephemeral નો અર્થ?", a: ["શાશ્વત", "ક્ષણભંગુર", "લાંબુ", "સ્થિર"], ans: "ક્ષણભંગુર"},
    {q: "Pragmatic નો અર્થ?", a: ["વ્યવહારુ", "કાલ્પનિક", "ભાવુક", "અવિચારી"], ans: "વ્યવહારુ"},
    {q: "Superfluous નો અર્થ?", a: ["જરૂરી", "વધારે", "અલ્પ", "મહત્વનું"], ans: "વધારે"},

        function save() { localStorage.walletEnglish = JSON.stringify({ coins, wallet, lastSpin, lastLogin }); }

        function render() {
            while (coins >= 100) { coins -= 100; wallet += 10; }
            while (coins < 0 && wallet > 0) { coins += 100; wallet -= 1; }
            document.getElementById("c").textContent = coins;
            document.getElementById("w").textContent = wallet;
            save();
        }

        function check(choice) {
            if (choice === quiz[currentQ].ans) {
                coins += 5; alert("સાચો જવાબ! +5 કોઈન.");
            } else {
                coins -= 5; alert("ખોટો જવાબ! -5 કોઈન.");
            }
            currentQ = (currentQ + 1) % quiz.length;
            render(); loadQuiz();
        }

        function loadQuiz() {
            let q = quiz[currentQ];
            document.getElementById("qText").textContent = q.q;
            document.getElementById("opts").innerHTML = q.a.map(opt =>
                `<button onclick="check('${opt}')">${opt}</button>`
            ).join('');
        }

        function spin() {
            let today = new Date().toDateString();
            if (lastSpin === today) { alert("આજે સ્પિન કરી લીધું છે!"); return; }
            document.getElementById("wheel").style.transform = `rotate(${Math.random() * 1000 + 1000}deg)`;
            setTimeout(() => { coins += 20; lastSpin = today; render(); alert("તમે 20 કોઈન જીત્યા!"); }, 3000);
        }

        function dailyReward() {
            let today = new Date().toDateString();
            if (lastLogin !== today) { coins += 50; lastLogin = today; render(); alert("50 કોઈન મળ્યા!"); }
            else { alert("આજે રિવોર્ડ લઈ લીધું છે!"); }
        }

        render(); loadQuiz();
        // પ્રશ્નોનો ડેટા (તમારા અગાઉના એરે મુજબ)
const levels = {
    easy: [/* સરળ પ્રશ્નો */],
    medium: [/* મધ્યમ પ્રશ્નો */],
    hard: [/* અઘરા પ્રશ્નો */]
};

let currentLevel = 'easy';
let score = 0;
let correctCount = 0;
let totalQuestionsInLevel = 10; // એક લેવલમાં પ્રશ્નોની સંખ્યા

// ૧. રેન્ડમ પ્રશ્નો મેળવવા માટે
function getShuffledQuestions(level) {
    let questions = [...levels[level]];
    return questions.sort(() => Math.random() - 0.5);
}

// ૨. સ્કોરિંગ સિસ્ટમ
function updateScore(level, isCorrect) {
    if (isCorrect) {
        correctCount++;
        if (level === 'easy') score += 1;
        else if (level === 'medium') score += 2;
        else if (level === 'hard') score += 3;
    }
}

// ૩. લેવલ અનલોક લોજિક
function checkLevelUnlock() {
    let passingCriteria = totalQuestionsInLevel * 0.8; // 80% સાચા હોવા જોઈએ
    
    if (correctCount >= passingCriteria) {
        if (currentLevel === 'easy') currentLevel = 'medium';
        else if (currentLevel === 'medium') currentLevel = 'hard';
        console.log("અભિનંદન! તમે આગલા લેવલ પર પહોંચી ગયા છો.");
    } else {
        console.log("ફરી પ્રયાસ કરો, તમારે ૮૦% સાચા જવાબોની જરૂર છે.");
    }
}
// ૧. પ્રશ્ન લોડ કરતી વખતે ઓપ્શન્સને મિક્સ કરવાનું ફંક્શન
function getQuestion(index) {
    let currentQuiz = quiz[index];
    
    // ઓપ્શન્સની નકલ બનાવો
    let options = [...currentQuiz.a];
    
    // ઓપ્શન્સને રેન્ડમલી મિક્સ કરો (Shuffle)
    options.sort(() => Math.random() - 0.5);
    
    // હવે આ 'options' એરેનો ઉપયોગ કરીને બટન બનાવો
    // આનાથી સાચો જવાબ દરેક વખતે અલગ બટન પર આવશે
    displayOptions(options); 
}

// ૨. ચેક કરવા માટેનું ફંક્શન
function checkAnswer(selectedOption, correctAnswer) {
    if (selectedOption === correctAnswer) {
        console.log("સાચું!");
    } else {
        console.log("ખોટું!");
    }
}
