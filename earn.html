    function updateWallet(amount) {
        wallet += amount;
        if(wallet < 0) wallet = 0;
        localStorage.setItem("wallet", wallet.toFixed(2));
        document.getElementById("wallet").innerText = wallet.toFixed(2);
        checkWithdrawStatus();
    }

    function checkWithdrawStatus() {
        document.getElementById("withdrawBtn").disabled = (wallet < 200);
    }

    function showScreen(id) {
        document.getElementById('dashboard').classList.toggle('hidden', id !== 'dashboard');
        document.getElementById('quiz').classList.toggle('hidden', id !== 'quiz');
        if(id === 'quiz') loadQuiz();
    }

    function claimReward() {
        let lastClaim = localStorage.getItem("lastClaim");
        let today = new Date().toDateString();
        if (lastClaim === today) {
            alert("તમે આજે રિવોર્ડ લઈ લીધો છે!");
        } else {
            updateWallet(5.00);
            localStorage.setItem("lastClaim", today);
            alert("Congratulations! ₹5 મળ્યા.");
        }
    }

    function spinWheel() {
        let lastSpin = localStorage.getItem("lastSpin");
        let today = new Date().toDateString();
        if (lastSpin === today) {
            alert("તમે આજે સ્પિન કરી લીધું છે!");
        } else {
            let prize = Math.floor(Math.random() * 20) + 1;
            alert("Congratulations! Spin પર તમને ₹" + prize + " મળ્યા!");
            updateWallet(prize);
            localStorage.setItem("lastSpin", today);
        }
    }

    function withdrawMoney() {
        alert("🎉 સફળ! ₹" + wallet.toFixed(2) + " ટૂંક સમયમાં ટ્રાન્સફર થશે.");
        wallet = 0;
        updateWallet(0);
    }

    function loadQuiz() {
        let q = quizData[Math.floor(Math.random() * quizData.length)];
        document.getElementById("question").innerText = q.q;
        let optDiv = document.getElementById("options");
        optDiv.innerHTML = "";
        q.options.forEach((o, i) => {
            let b = document.createElement("button");
            b.className = "option-btn";
            b.innerText = o;
            b.onclick = () => {
                if(i === q.correct) {
                    updateWallet(0.5); // સાચો જવાબ પર 0.5
                    alert("સાચો! +₹0.5");
                } else {
                    updateWallet(-0.2); // ખોટો જવાબ પર 0.2 માઈનસ
                    alert("ખોટો! -₹0.2");
                }
                loadQuiz();
            };
            optDiv.appendChild(b);
        });
    }

    document.getElementById("wallet").innerText = wallet.toFixed(2);
    checkWithdrawStatus();
</script>
