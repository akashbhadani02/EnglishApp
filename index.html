<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Game</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>  
  <script type="module" src="main.js"></script>
  <style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
  background: black;
}

/* TOP UI */
#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  z-index: 10;
  background: rgba(0,0,0,0.6);
  padding: 10px;
  border-radius: 8px;
  max-width: 90%;
  font-size: 14px;
}

/* BATTLE BOX */
#battleBox {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 320px);
  background: rgba(0,0,0,0.85);
  color: white;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  font-size: 14px;
}

/* ANSWER BUTTONS */
#answers button {
  display: block;
  width: 100%;
  margin: 6px 0;
  padding: 10px;
  cursor: pointer;
  font-size: 14px;
}

/* HIDDEN */
.hidden {
  display: none;
}

/* MOBILE CONTROLS (future use) */
@media (max-width: 768px) {
  #ui {
    font-size: 12px;
    padding: 8px;
  }

  #battleBox {
    font-size: 13px;
  }

  #answers button {
    padding: 12px;
    font-size: 13px;
  }
}
  </style>
</head>

<body>

  <div id="ui">
    <h2>English Game</h2>
    <p>Defeat robots by answering English questions</p>
    <p id="robotCount">Robots left: 0</p>
  </div>
<div id="battleBox" class="hidden">
  <h3>🤖 Robot Challenge!</h3>
  <button id="voiceBtn">🎤 Speak Answer</button>
  <p id="questionText"></p>

  <div id="answers"></div>

  <p id="result"></p>
</div>
  <script>
    document.getElementById("voiceBtn").addEventListener("click", () => {
  if (!inBattle) return;

  resultText.innerText = "🎤 Listening...";

  voice.start((spokenText) => {
    checkVoiceAnswer(spokenText);
  });
});

// ----------------------
// BATTLE SYSTEM
// ----------------------

const battleBox = document.getElementById("battleBox");
const questionText = document.getElementById("questionText");
const answersDiv = document.getElementById("answers");
const resultText = document.getElementById("result");
const robotCountText = document.getElementById("robotCount");

let inBattle = false;
let currentRobot = null;

const questions = [
  // ---------------- BASIC GRAMMAR ----------------
  { q: "What is correct?", options: ["I am fine", "I fine am", "Fine I am"], answer: 0 },
  { q: "Choose correct sentence", options: ["He go to school", "He goes to school", "He going school"], answer: 1 },
  { q: "Correct greeting?", options: ["Good morning", "Morning good you", "Good night morning"], answer: 0 },
  { q: "Which is correct?", options: ["She are happy", "She is happy", "She happy is"], answer: 1 },
  { q: "Select correct sentence", options: ["They is playing", "They are playing", "They playing are"], answer: 1 },

  // ---------------- DAILY ENGLISH ----------------
  { q: "How do you ask for water?", options: ["Give water", "I want water now", "Can I have some water?"], answer: 2 },
  { q: "Polite request?", options: ["Open door", "Please open the door", "Door open now"], answer: 1 },
  { q: "Correct sentence?", options: ["I am going home", "I going home am", "Going I home"], answer: 0 },
  { q: "Ask time politely", options: ["What time it is?", "Can you tell me the time?", "Time tell me"], answer: 1 },
  { q: "Correct response?", options: ["Yes, I can help you", "Yes help I", "I help yes"], answer: 0 },

  // ---------------- SHOPPING ENGLISH ----------------
  { q: "At shop you say?", options: ["Give this item", "I want buy this", "I would like to buy this"], answer: 2 },
  { q: "Ask price politely", options: ["How much this?", "What is the price of this?", "Price tell"], answer: 1 },
  { q: "Correct sentence", options: ["This is expensive", "This expensive is", "Expensive this is"], answer: 0 },

  // ---------------- TRAVEL ENGLISH ----------------
  { q: "At airport you say?", options: ["I want go", "I am going flight", "I would like to check in"], answer: 2 },
  { q: "Ask direction?", options: ["Where bathroom is?", "Where is the bathroom?", "Bathroom where is"], answer: 1 },
  { q: "Correct sentence", options: ["I need a ticket", "I ticket need", "Need I ticket"], answer: 0 },

  // ---------------- SCHOOL ENGLISH ----------------
  { q: "Teacher asks:", options: ["Sit down please", "Down sit please", "Please sit down"], answer: 2 },
  { q: "Correct answer", options: ["I have done my homework", "I done homework have", "Homework I done"], answer: 0 },

  // ---------------- GENERAL MIX ----------------
  { q: "Best greeting", options: ["Hello", "Hell you", "Hi bye"], answer: 0 },
  { q: "Correct sentence", options: ["I like English", "I English like", "Like I English"], answer: 0 },
  { q: "Choose correct", options: ["He is my friend", "He my friend is", "Friend he is my"], answer: 0 },

  // ---------------- EXPANDED (repeat pattern to grow game) ----------------
  { q: "What is correct?", options: ["We are students", "We is students", "We students are"], answer: 0 },
  { q: "Choose correct sentence", options: ["She is reading", "She reading is", "Reading she is"], answer: 0 },
  { q: "Correct form?", options: ["I am learning English", "I learning English am", "Learning I English"], answer: 0 },
  { q: "Polite English?", options: ["Help me", "Please help me", "Help now me"], answer: 1 },
  { q: "Correct sentence", options: ["They are friends", "They is friends", "Friends they are"], answer: 0 },

  // DAILY LIFE
  { q: "What do you say when you meet someone?", options: ["Nice to meet you", "Meet you nice", "You meet nice"], answer: 0 },
  { q: "How do you ask for help?", options: ["Help me now", "Can you help me?", "You help I"], answer: 1 },
  { q: "Correct apology?", options: ["I am sorry", "Sorry I am", "I sorry am"], answer: 0 },
  { q: "What do you say before eating?", options: ["Let's eat", "Eat now go", "Food start"], answer: 0 },

  // SCHOOL ENGLISH
  { q: "Teacher says to stand up?", options: ["Stand up please", "Up stand please", "Please stand up"], answer: 2 },
  { q: "Correct classroom sentence?", options: ["I have a pen", "I pen have", "Pen I have"], answer: 0 },
  { q: "Ask permission?", options: ["May I come in?", "I come may in", "Come I may"], answer: 0 },
  { q: "Correct response to teacher", options: ["Yes ma'am", "Ma'am yes", "Yes I ma'am"], answer: 0 },

  // TRAVEL ENGLISH
  { q: "At hotel check-in you say?", options: ["I want room", "I need a room", "Room give me"], answer: 1 },
  { q: "Ask for directions", options: ["Where is the station?", "Station where is?", "Where station"], answer: 0 },
  { q: "At bus stop you say?", options: ["Bus when come?", "When will the bus come?", "Bus come when"], answer: 1 },

  // SHOPPING
  { q: "Ask for discount?", options: ["Any discount available?", "Discount give me", "Price low now"], answer: 0 },
  { q: "Correct shop sentence", options: ["I want to return this", "I return this want", "This return I want"], answer: 0 },

  // FRIEND TALK
  { q: "Invite a friend", options: ["Come with me", "You come now me", "With me come"], answer: 0 },
  { q: "Agree with someone", options: ["I agree", "Agree I", "I am agree you"], answer: 0 },
  { q: "Disagree politely", options: ["I don't think so", "I not think", "Think not I"], answer: 0 },

  // EMOTIONS
  { q: "How do you express happiness?", options: ["I am happy", "Happy I am", "I happy am"], answer: 0 },
  { q: "Express sadness", options: ["I feel sad", "Sad I feel", "I sad feel"], answer: 0 },

  // GENERAL CONVERSATION
  { q: "Ask someone's name", options: ["What is your name?", "Name your what?", "You name what"], answer: 0 },
  { q: "Respond to thanks", options: ["You're welcome", "Welcome you are", "You welcome"], answer: 0 },
  { q: "Say goodbye", options: ["Goodbye", "Bye hello", "Go now bye"], answer: 0 },

  // PRACTICAL LIFE
  { q: "Ask for time", options: ["What is the time?", "Time what is?", "Tell time me"], answer: 0 },
  { q: "Ask for water politely", options: ["Can I have water?", "Water give me", "I water want"], answer: 0 },
  { q: "Ask for price", options: ["How much is this?", "Price this what?", "This how much"], answer: 0 }
];

function updateRobotCount() {
  robotCountText.innerText = `Robots left: ${robots.length}`;
}

function startBattle(robot) {
    if (inBattle) return;

    inBattle = true;
    currentRobot = robot;

    const q = questions[Math.floor(Math.random() * questions.length)];

    questionText.innerText = q.q;
    answersDiv.innerHTML = "";
    resultText.innerText = "";

    q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.innerText = opt;

        btn.onclick = () => {
            if (index === q.answer) {
                resultText.innerText = "✅ Correct! Robot defeated!";
                scene.remove(robot);
                robots.splice(robots.indexOf(robot), 1);
                updateRobotCount();
            } else {
                resultText.innerText = "❌ Wrong answer! Try again!";
            }

            setTimeout(() => {
                battleBox.classList.add("hidden");
                inBattle = false;
            }, 1000);
        };

        answersDiv.appendChild(btn);
    });

    battleBox.classList.remove("hidden");
}

// Scene setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // sky blue

// Camera
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(0, 5, 10);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Light
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10, 20, 10);
scene.add(light);

// Ground (road + land)
const groundGeometry = new THREE.PlaneGeometry(50, 50);
const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 });
const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Road
const roadGeometry = new THREE.PlaneGeometry(5, 50);
const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
const road = new THREE.Mesh(roadGeometry, roadMaterial);
road.rotation.x = -Math.PI / 2;
road.position.y = 0.01;
scene.add(road);

// Buildings (India-style simple houses)
function createBuilding(x, z) {
    const geometry = new THREE.BoxGeometry(2, 3, 2);
    const material = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
    const building = new THREE.Mesh(geometry, material);
    building.position.set(x, 1.5, z);
    scene.add(building);
}

// Add buildings
createBuilding(-6, -5);
createBuilding(6, -5);
createBuilding(-6, 5);
createBuilding(6, 5);

// ----------------------
// ROBOT ENEMIES
// ----------------------

const robots = [];

function createRobot(x, z) {
  const enemy = new THREE.Group();

  // ========================
  // BODY (cartoon capsule)
  // ========================
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.6, 1.2, 6, 12),
    new THREE.MeshStandardMaterial({ color: 0xff4d4d })
  );
  body.position.y = 1;
  enemy.add(body);

  // ========================
  // HEAD (big cartoon head)
  // ========================
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.7, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0xffcc66 })
  );
  head.position.y = 2.4;
  enemy.add(head);

  // ========================
  // EYES
  // ========================
  const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });

  const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.1), eyeMaterial);
  eye1.position.set(-0.25, 2.5, 0.55);

  const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.1), eyeMaterial);
  eye2.position.set(0.25, 2.5, 0.55);

  enemy.add(eye1);
  enemy.add(eye2);

  // ========================
  // ANGRY EYEBROWS (cartoon feel)
  // ========================
  const browMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

  const brow1 = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.05, 0.05), browMat);
  brow1.position.set(-0.25, 2.7, 0.55);
  brow1.rotation.z = 0.4;

  const brow2 = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.05, 0.05), browMat);
  brow2.position.set(0.25, 2.7, 0.55);
  brow2.rotation.z = -0.4;

  enemy.add(brow1);
  enemy.add(brow2);

  // ========================
  // ARMS
  // ========================
  const armMat = new THREE.MeshStandardMaterial({ color: 0xff4d4d });

  const arm1 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1), armMat);
  arm1.position.set(-0.9, 1.2, 0);

  const arm2 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1), armMat);
  arm2.position.set(0.9, 1.2, 0);

  enemy.add(arm1);
  enemy.add(arm2);

  // ========================
  // POSITION
  // ========================
  enemy.position.set(x, 0, z);

  // ========================
  // AI DATA (WITH LAG)
  // ========================
  enemy.userData = {
    speed: 0.02,
    direction: Math.random() * Math.PI * 2,
    lag: 0.05 // smooth movement
  };

  scene.add(enemy);
  robots.push(enemy);
}
// ----------------------
// SPAWN 30 ROBOTS
// ----------------------

for (let i = 0; i < 30; i++) {
  const x = (Math.random() - 0.5) * 40; // spread in city
  const z = (Math.random() - 0.5) * 40;

  createRobot(x, z);
}
updateRobotCount(); 

// Player (simple cube for now)
const playerGeometry = new THREE.BoxGeometry(1, 1, 1);
const playerMaterial = new THREE.MeshStandardMaterial({ color: 0x0000ff });
const player = new THREE.Mesh(playerGeometry, playerMaterial);
player.position.y = 0.5;
scene.add(player);

// Controls
const keys = {};
document.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

// Movement speed
const speed = 0.1;

// Game loop
function animate() {
    requestAnimationFrame(animate);

    // Movement
    if (keys["w"]) player.position.z -= speed;
    if (keys["s"]) player.position.z += speed;
    if (keys["a"]) player.position.x -= speed;
    if (keys["d"]) player.position.x += speed;

    // Camera follow (third person)
    camera.position.x = player.position.x;
    camera.position.z = player.position.z + 8;
    camera.position.y = 5;
    camera.lookAt(player.position);

    // ----------------------
    // ROBOT AI MOVEMENT
    // ----------------------

    robots.forEach(robot => {
        robot.position.x += Math.cos(robot.userData.direction) * robot.userData.speed;
        robot.position.z += Math.sin(robot.userData.direction) * robot.userData.speed;

        // change direction randomly
        if (Math.random() < 0.01) {
            robot.userData.direction = Math.random() * Math.PI * 2;
        }

        // make robot face player
        robot.lookAt(player.position);
    });
    robots.forEach(robot => {
        const distance = player.position.distanceTo(robot.position);

        if (distance < 2 && !inBattle) {
            startBattle(robot);
        }
    });
    renderer.render(scene, camera);
}

animate();

// Resize support
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

let move = {
  forward: false,
  back: false,
  left: false,
  right: false
};

// keyboard (PC)
document.addEventListener("keydown", (e) => {
  if (e.key === "w") move.forward = true;
  if (e.key === "s") move.back = true;
  if (e.key === "a") move.left = true;
  if (e.key === "d") move.right = true;
});

document.addEventListener("keyup", (e) => {
  if (e.key === "w") move.forward = false;
  if (e.key === "s") move.back = false;
  if (e.key === "a") move.left = false;
  if (e.key === "d") move.right = false;
});     

class Voice {
  constructor() {
    this.recognition = null;
    this.isListening = false;

    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      this.recognition = new SpeechRecognition();
      this.recognition.lang = "en-US";
      this.recognition.continuous = false;
      this.recognition.interimResults = false;
    }
  }

  start(onResult) {
    if (!this.recognition) {
      alert("Speech Recognition not supported in this browser");
      return;
    }

    this.recognition.start();
    this.isListening = true;

    this.recognition.onresult = (event) => {
      const text = event.results[0][0].transcript.toLowerCase();
      onResult(text);
    };

    this.recognition.onend = () => {
      this.isListening = false;
    };
  }
}

const voice = new Voice();
  </script>

</body>

</html>
